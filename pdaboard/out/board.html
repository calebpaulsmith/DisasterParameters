/* ---------------- map ---------------- */
const MAP = {W:640,H:760,paths:{},proj:null};
(function buildMap(){
  const feats = DATA.geo.features;
  const rowsByFips={}; DATA.counties.forEach(r=>{ if(r.fips) rowsByFips[r.fips]=r.county; });
  // Fit the camera to the SCOPE counties (plus margin), not the whole state —
  // a PDA clustered in one region fills the card instead of floating in it.
  const scopeFeats = feats.filter(f=>rowsByFips[f.id]);
  const fitFeats = scopeFeats.length ? scopeFeats : feats;
  let minLon=1e9,maxLon=-1e9,minLat=1e9,maxLat=-1e9;
  const each = (g,fn)=> (g.type==="Polygon"?g.coordinates:g.coordinates.flat(1)).forEach(ring=>ring.forEach(fn));
  fitFeats.forEach(f=>each(f.geometry,p=>{minLon=Math.min(minLon,p[0]);maxLon=Math.max(maxLon,p[0]);
                                          minLat=Math.min(minLat,p[1]);maxLat=Math.max(maxLat,p[1]);}));
  const mLon=(maxLon-minLon)*0.04, mLat=(maxLat-minLat)*0.04;   // 4% breathing room
  minLon-=mLon; maxLon+=mLon; minLat-=mLat; maxLat+=mLat;
  const kx=Math.cos((minLat+maxLat)/2*Math.PI/180);
  const sw=(maxLon-minLon)*kx, sh=maxLat-minLat, pad=8;
  const s=Math.min((MAP.W-2*pad)/sw,(MAP.H-2*pad)/sh);
  const ox=(MAP.W-sw*s)/2, oy=(MAP.H-sh*s)/2;
  MAP.proj=p=>[ox+(p[0]-minLon)*kx*s, oy+(maxLat-p[1])*s];
  MAP.center={}; MAP.bbox={};
  feats.forEach(f=>{
    const polys=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    MAP.paths[f.id]=polys.map(rings=>rings.map(ring=>
      "M"+ring.map(p=>{const q=MAP.proj(p);
        if(q[0]<mnx)mnx=q[0]; if(q[0]>mxx)mxx=q[0]; if(q[1]<mny)mny=q[1]; if(q[1]>mxy)mxy=q[1];
        return q.map(v=>v.toFixed(1)).join(",");}).join("L")+"Z").join("")).join("");
    MAP.center[f.id]=[(mnx+mxx)/2,(mny+mxy)/2];
    MAP.bbox[f.id]={w:mxx-mnx,h:mxy-mny};
  });
  // met_only-EXCLUDED counties render as plain nonscope — the owner chose
  // "don't include" and that means the map too (2026-07-28; the red-shading
  // treatment belongs to boards that INCLUDE their non-met counties as rows)
  $("map").innerHTML=`<svg viewBox="0 0 ${MAP.W} ${MAP.H}" preserveAspectRatio="xMidYMid meet"><g class="zoomg"><g class="gp">`+
    feats.map(f=>{
      const cty=rowsByFips[f.id];
      return `<path id="p${f.id}" class="cty ${cty?"":"nonscope"}" d="${MAP.paths[f.id]}"
        ${cty?`data-cty="${esc(cty)}" tabindex="0" role="button" aria-label="${esc(cty)} County"`:""}></path>`;
    }).join("")+`</g><g class="gl"></g><g class="gv"></g></g></svg>`;
  // Inline labels for every scope county, sized to the shape: shrink the font
  // to fit (never below 8px ON SCREEN), wrap two-word names onto two lines
  // when one line won't go. Truly tiny slivers stay unlabeled (tooltip).
  // ZOOM-AWARE: at camera scale `sc` a label is drawn at (screen-font / sc)
  // svg units so names stay readable — and counties too small to label at 1×
  // GAIN labels once zoomed in. Re-rendered on every zoom change.
  MAP.renderLabels=function(sc){
    sc=sc||1;
    const gl=$("map").querySelector("g.gl"); if(!gl) return;
    const CH=0.62;                              // approx px per char per font px
    const halo=(2.6/sc).toFixed(2);
    gl.innerHTML=feats.map(f=>{
      const cty=rowsByFips[f.id]; if(!cty) return "";
      const bb=MAP.bbox[f.id], c=MAP.center[f.id];
      const AVAIL=bb.w*0.92;
      let fs=Math.min(12.5, AVAIL*sc/(CH*cty.length));   // screen px
      if(fs>=8 && bb.h*sc>=fs+5){
        const f1=fs/sc;
        return `<text class="ctylab" id="l${f.id}" x="${c[0].toFixed(1)}" y="${(c[1]+f1*0.35).toFixed(1)}" style="font-size:${f1.toFixed(2)}px;stroke-width:${halo}px">${esc(cty)}</text>`;
      }
      if(cty.includes(" ")){
        const words=cty.split(" ");
        let best=null;
        for(let i=1;i<words.length;i++){
          const l1=words.slice(0,i).join(" "), l2=words.slice(i).join(" ");
          const m=Math.max(l1.length,l2.length);
          if(!best||m<best.m) best={l1,l2,m};
        }
        const f2s=Math.min(12, AVAIL*sc/(CH*best.m));
        if(f2s>=8 && bb.h*sc>=2.4*f2s){
          const f2=f2s/sc;
          return `<text class="ctylab" id="l${f.id}" style="font-size:${f2.toFixed(2)}px;stroke-width:${halo}px">`+
            `<tspan x="${c[0].toFixed(1)}" y="${(c[1]-f2*0.22).toFixed(1)}">${esc(best.l1)}</tspan>`+
            `<tspan x="${c[0].toFixed(1)}" y="${(c[1]+f2*0.92).toFixed(1)}">${esc(best.l2)}</tspan></text>`;
        }
      }
      return "";
    }).join("");
  };
  MAP.renderLabels(1);
  const svg=$("map").firstElementChild;
  svg.addEventListener("mousemove",e=>{
    const t=e.target.closest("[data-cty]");
    if(!t){hideTip();return;}
    showTip(t.dataset.cty,e.clientX,e.clientY);
  });
  svg.addEventListener("mouseleave",hideTip);
  svg.addEventListener("mouseover",e=>{
    const t=e.target.closest("[data-cty]");
    // Re-appending the hovered path (to raise its outline) re-inserts the node
    // under the cursor, which re-fires mouseover — an endless churn that eats
    // the subsequent click (mousedown/up pair on "different" nodes → the click
    // retargets to the <g> and the county never opens). Bail if already raised.
    if(t && t.classList.contains("hover")) return;
    svg.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover"));
    if(t){
      t.classList.add("hover");
      t.parentNode.appendChild(t);   // raise so the bold outline isn't cut by neighbors
      showTip(t.dataset.cty,e.clientX,e.clientY);
    }
  });
  svg.addEventListener("click",e=>{
    let t=e.target.closest("[data-cty]");
    if(!t){                          // belt & suspenders: hit-test the point
      const el=document.elementFromPoint(e.clientX,e.clientY);
      t=el&&el.closest&&el.closest("[data-cty]");
    }
    if(t)openCounty(t.dataset.cty);
  });
  svg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const t=e.target.closest("[data-cty]"); if(t){e.preventDefault();openCounty(t.dataset.cty);}}});
})();

/* COMPLETE: zoom the camera onto a county when it's opened (CSS-transitioned
   transform on the .zoomg wrapper; strokes stay screen-width via
   vector-effect, labels hide while zoomed). mapZoom(null) flies back out. */
function mapZoom(fips){
  const svg=$("map").firstElementChild; if(!svg) return;
  const zg=svg.querySelector(".zoomg"); if(!zg) return;
  if(!fips || !MAP.bbox[fips]){
    zg.style.transform=""; svg.classList.remove("zoomed");
    MAP.sc=1;
    MAP.renderLabels(1);
    return;
  }
  const b=MAP.bbox[fips], c=MAP.center[fips];
  // county fills ~55% of the shorter axis, capped so slivers don't over-zoom
  const sc=Math.max(1.15, Math.min(4.5,
    0.55*Math.min(MAP.W/Math.max(1,b.w), MAP.H/Math.max(1,b.h))));
  zg.style.transform=`translate(${(MAP.W/2-sc*c[0]).toFixed(1)}px,${(MAP.H/2-sc*c[1]).toFixed(1)}px) scale(${sc.toFixed(3)})`;
  svg.classList.add("zoomed");
  // labels re-drawn zoom-compensated; paintMap (called by every mapZoom
  // caller right after) re-applies the .on visibility classes
  MAP.sc=sc;
  MAP.renderLabels(sc);
}
function ctyFill(r){
  // FILL matches the Thresholds rows (which double as the map legend):
  // met / light red 50-99 / darker red <50 / YELLOW at lead review / grey
  // not submitted. Under met_only every county met — a wall of green says
  // nothing, so met switches to the scheme's blue.
  if (r.stage===2) return css("--fill-rev");
  const p = (r.stage>=3 && r.ingested) ? r.pct_of_target : null;
  if (p == null) return css("--fill-pre");
  if (p >= 100) return css(DATA.met_only ? "--fill-metblue" : "--fill-met");
  if (p >= 50)  return css("--fill-half");
  return css("--fill-under");
}
function catBlue(frac){
  // pale -> deep USWDS blue, sqrt-eased so small shares stay visible
  const t=Math.sqrt(Math.max(0,Math.min(1,frac)));
  const a=[214,230,245], b=[8,81,156];
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function paintCatPeek(cat){
  // PEEK: fill = blue choropleth of this category-group's $ share by county;
  // the county's normal bucket color moves to its OUTLINE. `cat` may be a
  // comma list (type mode: "A,B").
  const cats=String(cat).split(",");
  const catsOf=r=>(showsMoney(r)&&r.cats)?cats.reduce((t,c)=>t+(r.cats[c]||0),0):0;
  const rows=allRows(S.event);
  const ix={}; rows.forEach(r=>{ if(r.fips) ix[r.fips]=r; });
  let mx=0; rows.forEach(r=>{ const v=catsOf(r); if(v>mx)mx=v; });
  DATA.geo.features.forEach(f=>{
    const el=document.getElementById("p"+f.id); if(!el) return;
    const r=ix[f.id]; if(!r) return;
    const v=catsOf(r);
    el.style.stroke=ctyFill(r);
    el.style.strokeWidth="2";
    el.style.fill = (mx>0&&v>0) ? catBlue(v/mx) : css("--surface3");
  });
}
function metricValue(r){
  if(S.mapMetric==="dollars") return showsMoney(r)?(catValue(r)||0):0;
  if(S.mapMetric==="apps") return appsValue(r)||0;
  return 0;
}
function paintMap(){
  const rows=allRows(S.event);
  const ix={}; rows.forEach(r=>{ if(r.fips) ix[r.fips]=r; });
  let mx=0;
  if(S.mapMetric) rows.forEach(r=>{ if(rowPass(r)){const v=metricValue(r); if(v>mx)mx=v;} });
  DATA.geo.features.forEach(f=>{
    const el=document.getElementById("p"+f.id); if(!el) return;
    const r=ix[f.id];
    el.classList.remove("selected","dimmed");
    el.style.stroke=""; el.style.strokeWidth="";
    const lab=document.getElementById("l"+f.id);
    if(!r){el.style.fill="";return;}
    const pass=rowPass(r);
    el.style.fill = S.mapMetric
      ? ((pass&&mx>0) ? catBlue(metricValue(r)/mx) : css("--surface3"))
      : ctyFill(r);
    // a VISIBLE county under its indicator keeps a red OUTLINE while the
    // metric choropleth owns the fill (its red fill already says so at rest)
    if(S.mapMetric && r.county_threshold && r.pct_of_target!=null && r.pct_of_target<100){
      el.style.stroke=css("--fill-under"); el.style.strokeWidth="2";
    }
    if(lab) lab.classList.toggle("on", r.stage>=3 && pass);
    if (!pass) el.classList.add("dimmed");
    if (S.selected && S.selected.type==="county" && S.selected.key===r.county){
      el.classList.add("selected");
      el.parentNode.appendChild(el);                  // keep the bold outline on top
    }
  });
  // per-county VALUE labels while a metric badge is active — the number
  // ($ or applicants) rendered under the county name, zoom-compensated
  const gv=$("map").querySelector("g.gv");
  if(gv){
    const sc=MAP.sc||1;
    gv.innerHTML = !S.mapMetric ? "" : rows.map(r=>{
      if(!r.fips||!rowPass(r)) return "";
      const v=metricValue(r); if(!v) return "";
      const c=MAP.center[r.fips]; if(!c) return "";
      const lab=document.getElementById("l"+r.fips);
      const named=lab&&lab.classList.contains("on");
      const fs=10.5/sc, halo=(2.4/sc).toFixed(2);
      const y=c[1]+(named?fs*1.6:fs*0.35);
      return `<text class="ctyval num" x="${c[0].toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${fs.toFixed(2)}px;stroke-width:${halo}px">${S.mapMetric==="dollars"?fmt$c(v):v}</text>`;
    }).join("");
  }
  // totals under the map (COMPLETE): both figures, honoring the current
  // filters + category slice — in normal flow so nothing overlaps
  const mt=$("mapTotals");
  if(mt){
    if(COMPLETE){
      const pass=rows.filter(rowPass);
      const t$=pass.reduce((a,r)=>a+(catValue(r)||0),0);
      const tA=pass.reduce((a,r)=>a+(appsValue(r)||0),0);
      mt.hidden=false;
      // sliced: lead with "Cat D —" (or the type-group name) once, bold —
      // it governs BOTH figures
      const sl=sliceLab();
      const lead=sl==="A–B"?"Emergency A–B":sl==="C–G"?"Permanent C–G":sl?("Cat "+sl.split("").join(", ")):null;
      const catLead=lead
        ?`<span class="mt-cat" title="Category slice — applies to both figures"><b>${lead}</b> —</span>`:"";
      mt.innerHTML=`${catLead}<span>$ Validated <b class="num">${fmt$(t$)}</b></span>
        <span>Applicants <b class="num">${tA}</b></span>`;
    } else mt.hidden=true;
  }
}

/* tooltip */
function showTip(cty,x,y){
  const r=rowFor(cty,S.event); if(!r) return hideTip();
  const tip=$("tip");
  const sc=dispStageColor(r);
  tip.innerHTML=`
    <div class="t-name">${esc(cty)} County
      ${COMPLETE?"":`<span class="t-stage" style="background:${sc};color:${contrastText(sc)}">${dispStage(r)}</span>`}</div>
    <div class="t-row"><span>Validated</span><b class="num">${showsMoney(r)?fmt$(r.validated_total):(r.ingested?"pending review":(r.stage>0?"in SharePoint — not in drop":"—"))}</b></div>
    <div class="t-row"><span>County indicator</span><b class="num">${fmtPct(r.pct_of_target)} of ${fmt$c(r.county_threshold)}</b></div>
    <div class="t-row"><span>Applicants</span><b class="num">${r.applicants_n??"—"}</b></div>
    ${r.inspector?`<div class="t-row"><span>Inspector</span><b>${esc(r.inspector)}</b></div>`:""}
    <div class="t-muted">Click to open the Chart A review</div>`;
  tip.style.display="block";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(x+16,innerWidth-w-10)+"px";
  tip.style.top=Math.min(y+14,innerHeight-h-10)+"px";
}
function hideTip(){ $("tip").style.display="none"; }
function contrastText(hex){
  const c=hex.replace("#",""); if(c.length<6) return "#1b1b1b";
  const n=parseInt(c,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.2126*r+0.7152*g+0.0722*b)>140 ? "#1b1b1b" : "#f6f8fb";
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.selected) backToTable(); });
$("rpChart").addEventListener("click",e=>{
  const keepScroll=fn=>{ const st=$("rpChart").scrollTop; fn(); $("rpChart").scrollTop=st; };
  // A–G category filter on the applicant table (shared slice — narrows the
  // whole board, same as the county table's menu)
  const av=e.target.closest("input[data-afv]");
  if(av){
    av.dataset.afv.split(",").forEach(v=>av.checked?S.catSel.add(v):S.catSel.delete(v));
    paintMap(); renderRight(); renderRail(); keepScroll(renderChartPane); return;
  }
  if(e.target.closest("[data-afall]")){
    ALLCATS.forEach(c=>S.catSel.add(c));
    paintMap(); renderRight(); renderRail(); keepScroll(renderChartPane); return;
  }
  const afm=e.target.closest("[data-afm]");
  if(afm){ S.openMenu=S.openMenu==="appcat"?null:"appcat"; keepScroll(renderChartPane); return; }
  if(e.target.closest(".fmenu")) return;      // clicks inside the menu stay put
  // applicant-table sort headers (County/Validated-style click-to-sort)
  const th=e.target.closest("th[data-appsort]");
  if(th){
    const col=th.dataset.appsort;
    if(S.appSort&&S.appSort.col===col) S.appSort.dir*=-1;
    else S.appSort={col, dir:col==="name"?1:-1};
    const st=$("rpChart").scrollTop; renderChartPane(); $("rpChart").scrollTop=st;
    return;
  }
  const tr=e.target.closest("tr.app"); if(!tr) return;
  const name=tr.dataset.appn;
  // comment expand/collapse (rows that have one), keyed by NAME so the open
  // set survives filtering/sorting
  if(tr.classList.contains("has")){
    S.appOpen.has(name)?S.appOpen.delete(name):S.appOpen.add(name);
  }
  // COMPLETE: clicking an applicant makes it ACTIVE — the rail category chart
  // becomes that applicant's A–G breakdown (click the active one to go back
  // to county numbers). The active row gets the gold marker.
  if(COMPLETE){
    S.selApp = S.selApp===name ? null : name;
    CAT_ANIM=true;
    renderRail();
  }
  const st=$("rpChart").scrollTop; renderChartPane(); $("rpChart").scrollTop=st;
});

function renderChartPane(){
  const P=$("rpChart");
  if(!S.selected){
    P.innerHTML=`<div class="empty">${COMPLETE
      ?"Click a county on the map or in the Counties list — its applicants, validation comments, files, and prior FEMA history open here."
      :"Pick a county to review its Chart A — applicants, validation comments, files."}</div>`;
    return;
  }
  const cty=S.selected.key, r=rowFor(cty,S.event);
  const mgc=CTY_ANIM?" grow":"", mgc2=CTY_ANIM?" grow2":""; CTY_ANIM=false;  // fill-up on open
  if(!r){P.innerHTML="";return;}
  const sc=dispStageColor(r);
  const apps=DATA.applicants.filter(a=>a.county===cty&&(S.event==="ALL"||a.event_id===S.event));
  if(S.appOpen==null)             // <=3 applicants: comments open by default
    S.appOpen=new Set(apps.length<=3?apps.map(a=>a.applicant):[]);
  const chartUrl=chartAUrl(r);
  const hist=r.fips?DATA.history[r.fips]:null;
  const base=trimSlash(S.spBase);      // live: swappable under Admin -> SharePoint links
  const catMax=r.cats?Math.max(...Object.values(r.cats),1):1;

  const thr=r.county_threshold, half=thr!=null?thr/2:null, p=r.pct_of_target;
  const g=(summary()||{}).guide_math||{};
  const incl = !r.ingested ? "Chart A not in the data drop yet — no validated figure."
    : p==null ? "No county threshold available."
    : p>=100 ? "Meets the county indicator — this county's damage counts toward the statewide indicator."
    : p>=50 ? (g.half_counts
        ? "At ≥50% of the indicator — currently counted toward the statewide total (the 75% condition is met)."
        : "At ≥50% of the indicator — held: it counts only once fully-met counties alone cover 75% of the statewide indicator.")
    : "Below 50% of the county indicator — excluded from the statewide total (PDA Guide).";
  const selbar=`
  <div class="selbar">
    <button class="backbtn" onclick="backToTable()" aria-label="Back to the county list">‹ Back</button>
    <button class="selrow" onclick="backToTable()" title="Collapse — back to the county list">
      <b>${esc(cty)}</b>
      ${COMPLETE?"<span></span>":`<span class="stagetag" style="background:${sc};color:${contrastText(sc)}">${r.stage>=2?SHORT_STAGE[r.stage]:"—"}</span>`}
      <span class="sv num">${r.ingested?fmt$(r.validated_total):"—"}</span>
      <span class="sp num ${p!=null&&p>=100?"ok":""}">${p!=null?fmtPct(p):"—"}</span>
      <span class="chev">▴</span>
    </button>
  </div>`;
  // applicant list honors the category-of-work slice exactly like the county
  // table: narrowed -> only applicants with $ in the selected categories, and
  // the Validated column shows the SLICED dollars. Both headers sort.
  const appVal=a=>catNarrowed()
    ? Math.round(ALLCATS.reduce((t,c)=>t+(S.catSel.has(c)?(a["cat_"+c.toLowerCase()]||0):0),0)*100)/100
    : a.total_calc;
  let appRows=catNarrowed()?apps.filter(a=>(appVal(a)||0)>0):apps.slice();
  if(S.appSort){
    const {col,dir}=S.appSort;
    appRows.sort((a,b)=>{
      const va=col==="name"?a.applicant.toLowerCase():(appVal(a)||0);
      const vb=col==="name"?b.applicant.toLowerCase():(appVal(b)||0);
      return (va<vb?-1:va>vb?1:0)*dir;
    });
  }
  const appArr=(col,d)=>S.appSort&&S.appSort.col===col?` <span class="arr">${S.appSort.dir>0?"▲":"▼"}</span>`:"";
  const valHead=catNarrowed()?`Validated · ${sliceLab()}`:"Validated";
  // translucent per-row bars: each applicant row carries a soft background
  // bar behind the text proportional to its (sliced) validated dollars
  const appBarMax=Math.max(1,...appRows.map(a=>appVal(a)||0));
  const appBar=a=>{
    const w=Math.round(100*(appVal(a)||0)/appBarMax);
    return w>0?` style="background:linear-gradient(90deg,var(--rowbar) ${w}%,transparent ${w}%)"`:"";
  };
  // the same category/type filter as the county table's Validated $ column —
  // ONE shared slice (S.catSel), so filtering here narrows the whole board
  const appFmenu=`<button class="fbtn ${catNarrowed()?"on":""}" data-afm title="Filter by category of work">${S.catGroup==="type"?"E/P ▾":"A–G ▾"}</button>`+
    (S.openMenu==="appcat"?`<div class="fmenu">${groupDefs().map(g=>
      `<label><input type="checkbox" data-afv="${g.key}"${g.cats.every(c=>S.catSel.has(c))?" checked":""}> ${g.label}</label>`).join("")}
      <button class="fall" data-afall>select all</button></div>`:"");
  const appsCard=apps.length?`<div class="card">
    <h3>Applicants · ${appRows.length}${catNarrowed()&&appRows.length!==apps.length?` <span class="muted">of ${apps.length}</span>`:""}</h3>
    <table class="apps"><thead><tr>
      <th data-appsort="name" style="cursor:pointer" title="Sort by applicant">Applicant${appArr("name")}</th>
      <th data-appsort="val" style="text-align:right;cursor:pointer" title="Sort by validated $">${valHead}${appArr("val")}${appFmenu}</th></tr></thead>
    <tbody>${appRows.map((a,i)=>{
      // comments expand per applicant (keyed by name): all open by default up
      // to 3 applicants, collapsed rows (click to expand) beyond that
      const open=S.appOpen.has(a.applicant);
      const active=COMPLETE&&S.selApp===a.applicant;
      return `
      <tr class="app ${a.comment?"has":""} ${open?"open":""} ${active?"sel":""}" data-appi="${i}" data-appn="${esc(a.applicant)}"${appBar(a)}${COMPLETE?` title="Click to chart this applicant's A–G breakdown on the left"`:""}>
        <td>${a.comment?`<span class="apx">▸</span>`:""}${active?`<span class="appmark" title="Active — charted on the left"></span>`:""}${esc(a.applicant)}</td>
        <td class="r num">${fmt$(appVal(a))}</td></tr>
      ${a.comment?`<tr class="comment" data-appc="${i}"${open?"":" hidden"}><td colspan="2"><div class="appcomment">${a.comment_html||esc(a.comment)}</div></td></tr>`:""}`;}).join("")}
    </tbody></table>
  </div>`:"";
  if(COMPLETE){
    // finished board: the county summary lives in the LEFT rail (Thresholds
    // card morph) — the right panel is applicants, the county's SharePoint
    // folder, and the prior-FEMA-history fold. Files root at the county's own
    // folder under Damage Data/Counties; the canonical Chart A link lives on
    // the selected row of the Counties card.
    const folderU=NOLINKS?null:countyFolderUrl(cty);
    const treeNodes=((DATA.files[cty]||{}).nodes||[]);
    const nFiles=treeNodes.filter(n=>!n.folder).length;
    P.innerHTML=selbar+appsCard+(NOLINKS?"":`
    <div class="card">
      <h3>Files</h3>
      ${chartUrl?`<a class="chartalink" href="${esc(chartUrl)}" target="_blank" rel="noopener"
          title="The master Chart A workbook this county's figures come from (Entered in Table A)">Chart A workbook ↗</a>`:""}
      ${folderU?`<a class="ftroot" href="${esc(folderU)}" target="_blank" rel="noopener" title="Open this county's folder in SharePoint — every working file and subfolder lives there">
          <span class="fic fic-dir">DIR</span><span class="ftname">Counties / ${esc(cty)}</span><span class="ftn">open in SharePoint ↗</span></a>`
        :`<div class="linknote">No county folder base yet — open Admin (the gear in the header) and set the SharePoint links, or load this PDA's <code>query.iqy</code>.</div>`}
      ${nFiles?`<details class="sub" open>
        <summary>Files known to the drop/export · ${nFiles}</summary>
        ${fileTreeHTML(cty)}
      </details>`:`<div class="linknote">No file listing for this county in the drop — open the folder above to browse it in SharePoint.</div>`}
    </div>`)+`
    ${hist?histCard(cty,hist,true):""}`;
    return;
  }
  P.innerHTML=selbar+`
  <div class="card">
    <div style="margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span class="ev">${esc(r.event_label)}</span>
      ${!r.ingested&&r.stage>0?`<span class="flagchip">chart in SharePoint — not in data drop</span>`:""}
      ${r.inspector?`<span class="p-insp">Inspector <b>${esc(r.inspector)}</b></span>`:""}
    </div>
    <div class="heroline">
      <span class="hero num">${r.ingested?fmt$(r.validated_total):"—"}</span>
      <span class="herosep">/</span>
      <span class="herothr num">${fmt$(thr)}</span>
      <span class="q" tabindex="0" aria-label="How the county indicator works"><span class="qmark">?</span>
        <div class="qpop">
          <div><b>County indicator:</b> ${fmt$(thr)}${r.population&&DATA.indicators.county_pci!=null?` = population ${r.population.toLocaleString()} × $${DATA.indicators.county_pci.toFixed(2)} county PCI (from Table A)`:""}.</div>
          <div><b>50% threshold:</b> ${half!=null?fmt$(half):"—"}.</div>
          <div class="qquote">“For counties that do not meet at least 50 percent of the countywide PCI, these costs should not be included in the overall statewide per capita impact calculation.” … “Counties that meet the countywide indicator may be recommended for designation, while counties that are at 50 percent will remain undesignated until they reach 100 percent of the countywide indicator.” <span class="cite">— PDA Guide (July 2025), p. 56 &amp; fn. 12</span></div>
          <div><b>Statewide inclusion:</b> ${incl}</div>
        </div>
      </span>
    </div>
    <div class="kpi-sub num">validated vs county indicator${p!=null?` · ${fmtPct(p)}`:""}</div>
    ${(()=>{const cg=meterGeom(p||0);return `
    <div class="meter teal ${cg.over?"over":""}">
      <span class="overlane" style="left:${cg.goal}%"></span>
      <i class="${mgc}" style="width:${cg.baseW}%"></i>
      ${cg.overW?`<i class="over${mgc2}" style="left:${cg.goal}%;width:${cg.overW}%"></i>`:""}
      <span class="tick" style="left:${cg.goal*0.5}%" title="50%"></span>
      <span class="tick goal" style="left:${cg.goal}%" title="100% — county indicator ${fmt$(thr)}"></span></div>
    <div class="mscale num"><span style="left:${cg.goal*0.5}%">50%</span><span style="left:${cg.goal}%">100%</span>${p>100?`<span class="mover">${fmtPct(p)}</span>`:""}</div>`;})()}
    ${r.emergency!=null?`
    <div class="split">
      <i style="flex:${r.emergency||0.001};background:var(--m2)" title="Emergency work ${fmt$(r.emergency)}"></i>
      <i style="flex:${r.permanent||0.001};background:var(--accent-dim)" title="Permanent work ${fmt$(r.permanent)}"></i>
    </div>
    <div class="split-legend">
      <span><span class="sw" style="background:var(--m2)"></span>Emergency (A–B) <b class="num">${fmt$c(r.emergency)}</b></span>
      <span><span class="sw" style="background:var(--accent-dim)"></span>Permanent (C–G) <b class="num">${fmt$c(r.permanent)}</b></span>
    </div>`:""}
    ${r.cats?`<div class="catcols">${"ABCDEFG".split("").map(c=>{
      const v=r.cats[c]||0;
      return `<div class="catcol ${v?"":"zero"}" title="${CAT_NAMES[c]}: ${v?fmt$(v):"$0"}">
        <span class="cv num">${v?fmt$c(v):""}</span><i style="height:${Math.max(2,Math.round(54*v/catMax))}px"></i><span class="cl">${c}</span></div>`;
    }).join("")}</div>`:""}
  </div>

  ${appsCard}

  ${NOLINKS?"":`<div class="card">
    <h3>Files</h3>
    ${chartUrl?`<a class="chartalink" href="${esc(chartUrl)}" target="_blank" rel="noopener"
        title="Open this county's Chart A workbook in SharePoint">Chart A workbook ↗</a>`:""}
    <details class="sub" open>
      <summary>SharePoint files · ${((DATA.files[cty]||{}).nodes||[]).filter(n=>!n.folder).length}</summary>
      ${fileTreeHTML(cty)}
    </details>
    ${!base?`<div class="linknote">No SharePoint site base yet — load this PDA's <code>query.iqy</code> under Admin &rarr; SharePoint links to make these clickable.</div>`:""}
  </div>`}

  ${hist?histCard(cty,hist):""}`;
}

/* ------------- Prior FEMA history (static OpenFEMA snapshot) ------------- */
const dnLab=d=>(d.type||"DR")+"-"+d.dn;
const fmtDate=t=>fmtD(t)||"—";   // shares the bare-date local-midnight fix
function histCard(cty,hist,collapsed){
  const meta=DATA.history_meta||{};
  const dis=(hist.disasters||[]).slice().sort((a,b)=>(a.declared||"").localeCompare(b.declared||""));
  const dmap={};dis.forEach(d=>dmap[d.dn]=d);
  const apps=hist.applicants||[];
  const first=dis.length?dis[0].declared:null,last=dis.length?dis[dis.length-1].declared:null;
  const active=dis.filter(d=>(d.applicants||0)>0||(d.paObligated||0)>0);
  // COMPLETE boards fold the card shut — click "Prior FEMA history" to expand
  const inner=`
    <div class="hroll">
      ${first?`From ${fmtDate(first)} to ${fmtDate(last)}:<br>`:""}
      <b class="num">${hist.priorApplicants}</b> Requests for Public Assistance<br>
      ${HSCRUB?"":`<b class="num">${fmt$c(hist.paObligated)}</b> PA obligated<br>`}
      <b class="num">${active.length}</b> declaration${active.length===1?"":"s"} (with PA applicants${HSCRUB?"":"/obligations"})
    </div>
    ${active.length?histChart(active):`<div class="linknote">No prior PA applicants${HSCRUB?"":" or obligations"} on record for this county.</div>`}
    ${active.length?`<div class="htleg">${active.slice().reverse().map(d=>`
      <div class="htlrow"><span class="htdn ${d.type==="EM"?"em":""}">${dnLab(d)}</span>
        <span class="htd num">${fmtDate(d.declared)}</span>
        <span class="htt" title="${esc(d.title||"")}">${esc(d.title||"")}${d.undesignated?` <span class="flagchip" title="PA dollars recorded in this county for a disaster whose declaration did not designate it">not designated</span>`:""}</span>
        <span class="hta num">${d.applicants||0} applicant${d.applicants===1?"":"s"}</span>
        ${HSCRUB?"":`<b class="num">${d.paObligated?fmt$c(d.paObligated):"—"}</b>`}</div>`).join("")}
    </div>`:""}
    ${apps.length?`<div class="hah">Prior PA applicants · ${apps.length}</div>
    <div class="halist">${apps.map(a=>`
      <div class="ha"><span class="han">${esc(a.name)}</span>
        <span class="had">${(a.disasters||[]).map(x=>HSCRUB?(dmap[x.dn]?dnLab(dmap[x.dn]):"DR-"+x.dn):`${dmap[x.dn]?dnLab(dmap[x.dn]):"DR-"+x.dn} (${fmt$c(x.pa)})`).join(", ")}</span>
        ${HSCRUB?"":`<b class="num">${fmt$c(a.pa)}</b>`}</div>`).join("")}
    </div>`:""}
    <div class="linknote">Static snapshot pulled directly from OpenFEMA — PublicAssistanceFundedProjectsSummaries v1 (applicant × county × disaster${HSCRUB?"":", federal share obligated"}) + DisasterDeclarationsSummaries v2${meta.covidExcluded?" · COVID-19 excluded":""}${HSCRUB?" · obligation dollars omitted from this board":""}. Context only, not a projection. <b>Last updated ${fmtDate(meta.fetchedAt)}</b></div>`;
  return collapsed
    ? `<details class="card fold hist"><summary>Prior FEMA history</summary>${inner}</details>`
    : `<div class="card hist"><h3>Prior FEMA history</h3>${inner}</div>`;
}
function histChart(dis){
  // HSCRUB (obligation dollars stripped): applicants-only single-bar chart
  const n=dis.length,slotW=HSCRUB?58:76,L=8,Rp=8,top=16,base=86,H=116;
  const W=L+Rp+n*slotW,bw=15,hh=base-top-4;
  const maxA=Math.max(1,...dis.map(d=>d.applicants||0));
  const maxP=Math.max(1,...dis.map(d=>d.paObligated||0));
  return `<svg class="httl" style="max-width:${Math.round(W*1.5)}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prior disasters with PA activity: applicants${HSCRUB?"":" and PA obligated"} per declaration">
    <line x1="${L}" y1="${base}" x2="${W-Rp}" y2="${base}" class="htax"/>
    ${dis.map((d,i)=>{const cx=L+slotW*(i+0.5);
      const hA=d.applicants?Math.max(4,Math.round(hh*d.applicants/maxA)):2;
      const hP=d.paObligated?Math.max(4,Math.round(hh*d.paObligated/maxP)):2;
      const yr=d.declared?d.declared.slice(0,4):"";
      return `<g><title>${esc(dnLab(d)+" — "+(d.title||"")+" · declared "+fmtDate(d.declared)+" · "+(d.applicants||0)+" PA applicants"+(!HSCRUB&&d.paObligated?" · "+fmt$c(d.paObligated)+" PA obligated":""))}</title>
        ${HSCRUB
          ?`<rect x="${(cx-bw/2).toFixed(1)}" y="${base-hA}" width="${bw}" height="${hA}" rx="2" class="htbar a"/>
            ${d.applicants?`<text x="${cx.toFixed(1)}" y="${base-hA-4}" class="htn" text-anchor="middle">${d.applicants}</text>`:""}`
          :`<rect x="${(cx-bw-1).toFixed(1)}" y="${base-hA}" width="${bw}" height="${hA}" rx="2" class="htbar a"/>
        <rect x="${(cx+1).toFixed(1)}" y="${base-hP}" width="${bw}" height="${hP}" rx="2" class="htbar p"/>
        ${d.applicants&&d.paObligated&&Math.abs(hA-hP)<14
          ?`<text x="${cx.toFixed(1)}" y="${base-Math.max(hA,hP)-4}" text-anchor="middle"><tspan class="htn">${d.applicants}</tspan><tspan class="htn p"> · ${fmt$c(d.paObligated)}</tspan></text>`
          :`${d.applicants?`<text x="${(cx-1-bw/2).toFixed(1)}" y="${base-hA-4}" class="htn" text-anchor="middle">${d.applicants}</text>`:""}
        ${d.paObligated?`<text x="${(cx+1+bw/2).toFixed(1)}" y="${base-hP-4}" class="htn p" text-anchor="middle">${fmt$c(d.paObligated)}</text>`:""}`}`}
        <text x="${cx.toFixed(1)}" y="${base+14}" class="htdnl" text-anchor="middle">${dnLab(d)}</text>
        <text x="${cx.toFixed(1)}" y="${base+26}" class="htyr2" text-anchor="middle">${yr}</text></g>`;}).join("")}
  </svg>
  <div class="htkey"><span><i style="background:var(--blue-dark)"></i>PA applicants</span>${HSCRUB?"":`<span><i style="background:var(--m3)"></i>PA obligated (own scale)</span>`}</div>`;
}
function isSourceFile(f){
  if(!f.source_events||!f.source_events.length) return false;
  return S.event==="ALL" ? true : f.source_events.includes(S.event);
}
/* ---- county file tree ----
   The county's SharePoint folder, as it really is: every subfolder and every
   document, each one a link. A node's URL is <prefix>/<disp>, so swapping the
   site base under Admin re-points the whole tree. `prefix_path` = straight out
   of the export (exact); `prefix_rel` = composed off the PDA root, which is
   what a completed drop with no export gets (labeled). */
function treePrefix(e){
  if(!e) return null;
  if(e.prefix_path!=null) return "/"+e.prefix_path;
  if(S.rootPath!=null && e.prefix_rel!=null)
    return S.rootPath+(e.prefix_rel?"/"+e.prefix_rel:"");
  return null;
}
function nestNodes(nodes){
  const root={dirs:new Map(), files:[], name:"", disp:""};
  nodes.forEach(n=>{
    const parts=String(n.disp||"").split("/").filter(Boolean);
    let cur=root;
    parts.forEach((p,i)=>{
      const sofar=parts.slice(0,i+1).join("/");
      if(i===parts.length-1 && !n.folder){
        cur.files.push(Object.assign({}, n, {label:p, full:sofar}));
      } else {
        if(!cur.dirs.has(p)) cur.dirs.set(p,{dirs:new Map(), files:[], name:p, disp:sofar});
        cur=cur.dirs.get(p);
      }
    });
  });
  return root;
}
const countTreeFiles = d => d.files.length +
  [...d.dirs.values()].reduce((a,x)=>a+countTreeFiles(x),0);
function fileTreeHTML(cty){
  const e=DATA.files[cty];
  if(!e||!e.nodes||!e.nodes.length)
    return `<div class="linknote">No files for this county in the drop.</div>`;
  const base=trimSlash(S.spBase), prefix=treePrefix(e);
  const url = d => (base&&prefix) ? base+"/"+encPath(prefix+"/"+d) : null;
  const render=(node,depth)=>{
    let out="";
    [...node.dirs.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{
      const u=url(d.disp), n=countTreeFiles(d);
      out+=`<details class="ftdir" open>
        <summary><span class="fic fic-dir">DIR</span><span class="ftname">${esc(d.name)}</span>
          <span class="ftn">${n} file${n===1?"":"s"}</span>
          ${u?`<a class="ftopen" href="${esc(u)}" target="_blank" rel="noopener" title="Open this folder in SharePoint">open ↗</a>`:""}
        </summary><div class="ftkids">${render(d,depth+1)}</div></details>`;
    });
    node.files.slice().sort((a,b)=>a.label.localeCompare(b.label))
      .forEach(f=>{ out+=fileRow(f, url(f.full), f.label); });
    return out;
  };
  return `<div class="ftree">${render(nestNodes(e.nodes),0)}</div>`
    + (e.prefix_path==null?`<div class="linknote">Folder layout read from the data drop (this drop has no SharePoint export) — links are composed from the PDA folder.</div>`:"");
}
// the county's own Chart A workbook in SharePoint: the export's exact path
// when there is one, else composed from the drop layout under the PDA root
function chartAUrl(r){
  const base=trimSlash(S.spBase);
  if(base && r.source_path) return base+"/"+encPath(r.source_path);
  const e=DATA.files[r.county];
  if(base && S.rootPath && r.source_rel && e && e.prefix_path==null)
    return base+"/"+encPath(S.rootPath+"/"+r.source_rel);
  return r.sp_url||null;
}
function fileRow(f, hrefOverride, labelOverride){
  // tree nodes carry `label` (leaf name), pipeline rows carry `name`
  const nm=labelOverride||f.name||f.label||"";
  const ext=(nm.split(".").pop()||"").toLowerCase();
  const [lab,cls]={xlsx:["XLS","x"],xls:["XLS","x"],pdf:["PDF","p"],docx:["DOC","d"],doc:["DOC","d"],
    msg:["MSG","m"],tif:["IMG","i"],jpg:["IMG","i"],jpeg:["IMG","i"],png:["IMG","i"],pptx:["PPT","t"]}[ext]||["FILE","o"];
  const ic=`<span class="fic fic-${cls}">${lab}</span>`;
  const src=isSourceFile(f);
  const inTree=labelOverride!==undefined;   // tree nodes have no pipeline stage
  const FSTAGE={4:"Entered",3:"Ready",2:"Lead Review"};
  let stageBadge="";
  if(inTree){ stageBadge=""; }
  else if(f.stage>=2){
    const c=stageColor(f.stage);
    stageBadge=`<span class="stagetag fstage" style="background:${c};color:${contrastText(c)}">${FSTAGE[f.stage]}</span>`;
  } else if(f.is_chart){
    stageBadge=`<span class="stagetag fstage" style="background:${css("--s0")};color:${contrastText(css("--s0"))}">Not submitted</span>`;
  }
  const badges=`${src?`<span class="srcbadge" title="This workbook is where the board's numbers for this county come from">SOURCE</span>`:""}${stageBadge}`;
  const meta=`${[f.by||"", fmtTs(f.modified)].filter(x=>x&&x!=="—").join(" · ")}`;
  const href=hrefOverride!==undefined?hrefOverride:fileUrl(f);
  return href
    ? `<a class="file ${src?"issrc":""}" href="${esc(href)}" target="_blank" rel="noopener">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></a>`
    : `<span class="file nolink ${src?"issrc":""}" title="${esc(f.disp||nm)}">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></span>`;
}

/* ---------------- ticker + movers ---------------- */
function renderTicker(){
  const svg=$("ticker");
  if(!svg || !svg.clientWidth) return;         // panel off or folded shut
  const W=svg.clientWidth,H=190,padL=64,padR=16,padT=14,padB=26;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const ev=S.event, snaps=DATA.snapshots;
  const pts=snaps.map(s=>({ts:s.run_ts,v:(s.events[ev]||{}).validated_total??null})).filter(p=>p.v!=null);
  const thresh=DATA.indicators.state_threshold;
  $("tickNote").textContent=pts.length<2?" — one snapshot so far; each data refresh adds a point":"";
  if(!pts.length){svg.innerHTML="";return;}
  const ymax=Math.max(thresh||0,...pts.map(p=>p.v))*1.06||1;
  const x=i=>pts.length===1?(padL+(W-padL-padR)/2):padL+(W-padL-padR)*i/(pts.length-1);
  const y=v=>padT+(H-padT-padB)*(1-v/ymax);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=pts.length>1?`${line}L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`:"";
  const gridVals=[0,.25,.5,.75,1].map(f=>f*ymax);
  svg.innerHTML=`
    ${gridVals.map(v=>`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}" stroke-width="1"></line>
      <text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="${css("--ink3")}">${fmt$c(v)}</text>`).join("")}
    ${thresh?`<line x1="${padL}" x2="${W-padR}" y1="${y(thresh)}" y2="${y(thresh)}" stroke="${css("--accent")}" stroke-width="1.5" stroke-dasharray="6 4"></line>
      <text x="${W-padR}" y="${y(thresh)-6}" text-anchor="end" font-size="10.5" font-weight="700" fill="${css("--accent-ink")}">state indicator ${fmt$c(thresh)}</text>`:""}
    ${area?`<path d="${area}" fill="${css("--m3")}" opacity="0.13"></path>`:""}
    ${pts.length>1?`<path d="${line}" fill="none" stroke="${css("--m3")}" stroke-width="2"></path>`:""}
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}"
        fill="${i===pts.length-1?css("--accent"):css("--m3")}" stroke="${css("--surface2")}" stroke-width="2">
        <title>${fmtTs(p.ts)} — ${fmt$(p.v)}</title></circle>`).join("")}
    <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-11}" text-anchor="${pts.length===1?"middle":"end"}"
        font-size="12" font-weight="800" fill="${css("--ink")}">${fmt$(pts[pts.length-1].v)}</text>
    <text x="${padL}" y="${H-8}" font-size="10" fill="${css("--ink3")}">${fmtTs(pts[0].ts)}</text>
    ${pts.length>1?`<text x="${W-padR}" y="${H-8}" text-anchor="end" font-size="10" fill="${css("--ink3")}">${fmtTs(pts[pts.length-1].ts)}</text>`:""}`;
}
function renderMovers(){
  const wrap=$("movers");
  if(!wrap) return;                            // panel off (Admin menu)
  const ms=DATA.movers.filter(m=>S.event==="ALL"||m.event_id===S.event);
  if(!ms.length){wrap.innerHTML=`<div class="none">${DATA.snapshots.length<2?"First snapshot — movers appear from the second refresh on.":"No changes since the previous refresh."}</div>`;return;}
  wrap.innerHTML=ms.slice(0,20).map(m=>{
    if(m.kind==="stage") return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="st">→ ${STAGE_LABELS[m.to_stage]}</span></div>`;
    if(m.kind==="new") return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="st">new</span>${m.delta_total?`<span class="up num">+${fmt$c(m.delta_total)}</span>`:""}</div>`;
    const up=m.delta_total>=0;
    return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="${up?"up":"dn"} num">${up?"+":"−"}${fmt$c(Math.abs(m.delta_total))}</span></div>`;
  }).join("");
}

/* ---------------- right panel: scope band + county table ---------------- */
const SHORT_STAGE={2:"Review",3:"Ready",4:"Entered"};
const TCOLS=COMPLETE?[
  // COMPLETE: stage is meaningless (all entered) -> applicant count; % of PCI
  // lives on the map/clock -> the column becomes the county-folder link
  // (dropped entirely when the board was built with links stripped)
  {k:"county", label:"County",       cls:"",  get:r=>r.county},
  {k:"apps",   label:"Applicants",   cls:"r", get:r=>appsValue(r)},
  {k:"dollars",label:"Validated $",  cls:"r", get:r=>catValue(r)??-1},
  ...(NOLINKS?[]:[{k:"folder", label:"Folder", cls:"", get:r=>r.county}]),
]:[
  {k:"county", label:"County",         cls:"",  get:r=>r.county},
  {k:"stage",  label:"Stage",          cls:"",  get:r=>r.stage},
  {k:"dollars",label:"Validated $",    cls:"r", get:r=>catValue(r)??r.validated_total??-1},
  {k:"pct",    label:"% of PCI", cls:"r", get:r=>r.pct_of_target??-1},
];
function countyFolderUrl(cty){
  const base=(S.masterFolder||"").trim().replace(/\/+$/,"");
  return base ? base+"/"+encodeURIComponent(cty) : null;
}
function renderRight(){
  const s=summary(), st=s.counties_by_stage||{}, scope=s.counties_total||0;
  const segs=[[4,st[4]||0],[3,st[3]||0],[2,st[2]||0]];
  const rest=scope-segs.reduce((a,x)=>a+x[1],0);
  // COMPLETE: no scope band — its county/applicant counts duplicate the
  // Thresholds card (owner 2026-07-27)
  $("scopeband").hidden=COMPLETE;
  $("scopeband").innerHTML=COMPLETE?"":`
    <span class="sb-title">Counties · ${scope}</span>
    <span class="sb-extra num">ready or entered <b>${s.counties_ready}/${scope}</b></span>
    <div class="sb-bar">${segs.filter(x=>x[1]).map(([k,n])=>
        `<i style="flex:${n};background:${stageColor(k)}" title="${STAGE_LABELS[k]}: ${n}"></i>`).join("")}
      ${rest?`<i style="flex:${rest};background:var(--s0)" title="Not yet submitted: ${rest}"></i>`:""}</div>
    <span class="sb-extra num">applicant rows <b>${s.applicants_n}</b></span>`;

  const col=TCOLS.find(c=>c.k===S.sort.col)||TCOLS[1];
  const rows=allRows(S.event).filter(rowPass).sort((a,b)=>{
    const va=col.get(a),vb=col.get(b);
    return (va<vb?-1:va>vb?1:(a.county<b.county?-1:1))*S.sort.dir;
  });
  const catOpts=groupDefs().map(g=>[g.key,g.label]);
  const FILTERS=COMPLETE?{
    dollars:{sel:S.catSel, opts:catOpts},
  }:{
    stage:{sel:S.stageSel, opts:[["4",STAGE_LABELS[4]],["3",STAGE_LABELS[3]],["2",STAGE_LABELS[2]],["pre","Not yet submitted"]]},
    pct:  {sel:S.pctSel,   opts:[["met","≥ 100% — met"],["half","50 – 99%"],["under","under 50%"],["review","For PDA Lead Review"],["none","not submitted / no figure"]]},
    dollars:{sel:S.catSel, opts:catOpts},
  };
  const fmenu=k=>{
    const f=FILTERS[k];
    const filtered=k==="dollars"?catNarrowed():f.sel.size<f.opts.length;
    // opt values may be comma lists (type mode) — checked = every cat present
    const has=v=>v.split(",").every(c=>f.sel.has(c));
    const lab=k==="dollars"?(S.catGroup==="type"?"E/P ▾":"A–G ▾"):"▾";
    return `<button class="fbtn ${filtered?"on":""}" data-fm="${k}" title="${k==="dollars"?"Filter by category of work":"Filter"}">${lab}</button>`+
      (S.openMenu===k?`<div class="fmenu">${f.opts.map(([v,l])=>
        `<label><input type="checkbox" data-fk="${k}" data-fv="${v}"${has(v)?" checked":""}> ${l}</label>`).join("")}
        <button class="fall" data-fall="${k}">select all</button></div>`:"");
  };
  const dollarsLabel = catNarrowed() ? `Validated $ · ${sliceLab()}` : "Validated $";
  // translucent per-row bars (COMPLETE): each county row carries a soft
  // background bar behind the text — validated $ or applicants, per the
  // metric toggle — sized against the biggest row currently shown
  const rowMetric = r => S.mapMetric==="apps" ? (appsValue(r)||0) : (catValue(r)||0);
  const rowBarMax = COMPLETE ? Math.max(1,...rows.map(rowMetric)) : 1;
  // a MIXED board (met + did-not-meet counties both visible) calls its rows
  // out loud: full-width green/red row tint with the proportional metric bar
  // in a stronger shade — small counties' bars alone were invisible. All-met
  // boards keep the quiet blue bar.
  const metOf = r => !(r.county_threshold && r.pct_of_target!=null && r.pct_of_target<100);
  const rowsAllEv = allRows(S.event);
  const mixed = COMPLETE && rowsAllEv.some(metOf) && rowsAllEv.some(r=>!metOf(r));
  const rowBar = r => {
    if(!COMPLETE) return "";
    const w=Math.round(100*rowMetric(r)/rowBarMax);
    if(mixed){
      const m=metOf(r);
      const strong=m?"rgba(63,143,104,.30)":"rgba(192,82,72,.32)";
      const weak  =m?"rgba(63,143,104,.10)":"rgba(192,82,72,.12)";
      return ` style="background:linear-gradient(90deg,${strong} ${w}%,${weak} ${w}%)"`;
    }
    const col = metOf(r) ? "var(--rowbar)" : "var(--rowbar-red)";
    return w>0?` style="background:linear-gradient(90deg,${col} ${w}%,transparent ${w}%)"`:"";
  };
  // COMPLETE: Applicants is a small count — hand its width to Validated $ so
  // eight-digit dollars + the category ▾ never clip
  const CW = COMPLETE ? (NOLINKS?["34%","24%","42%"]:["25%","19%","36%","20%"])
                      : ["31%","24%","23%","22%"];
  $("ctbl").innerHTML=`<colgroup>${["c-county","c-stage","c-val","c-pct"].slice(0,CW.length).map((cl,i)=>
    `<col class="${cl}" style="width:${CW[i]}">`).join("")}</colgroup><thead><tr>${TCOLS.map(c=>
    `<th class="${c.cls}" data-col="${c.k}">${c.k==="dollars"?dollarsLabel:c.label}${S.sort.col===c.k?` <span class="arr">${S.sort.dir>0?"▲":"▼"}</span>`:""}${FILTERS[c.k]?fmenu(c.k):""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>{
    const sel=S.selected&&S.selected.key===r.county;
    const dv = catNarrowed()?catValue(r):r.validated_total;
    if(COMPLETE){
      const fu=NOLINKS?null:countyFolderUrl(r.county);
      // the selected county's row grows a link bar: the canonical Chart A
      // (the master workbook from the Entered in Table A folder) + its folder
      const cu=(sel&&!NOLINKS)?chartAUrl(r):null;
      const linkrow=(sel&&!NOLINKS)?`<tr class="linkrow"><td colspan="4"><div class="lb">
        ${cu?`<a class="chartalink sm" href="${esc(cu)}" target="_blank" rel="noopener" title="The master Chart A workbook this county's figures come from (Entered in Table A)">Chart A workbook ↗</a>`:""}
        ${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener">County folder ↗</a>`:""}
      </div></td></tr>`:"";
      return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}"${rowBar(r)}>
        <td><b>${esc(r.county)}</b></td>
        <td class="r num">${appsValue(r)??"—"}</td>
        <td class="r num">${fmt$(dv)}</td>
        ${NOLINKS?"":`<td>${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener" title="Open the ${esc(r.county)} county folder">Open ↗</a>`
                 :`<span class="muted" title="No county folder base — set one under Admin (gear) &rarr; SharePoint links">—</span>`}</td>`}</tr>`+linkrow;
    }
    const sc=dispStageColor(r);
    const p=r.pct_of_target;
    const showP = r.stage>=3 && p!=null;
    return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}">
      <td><b>${esc(r.county)}</b></td>
      <td><span class="stagetag" style="background:${sc};color:${contrastText(sc)}">${r.stage>=3?SHORT_STAGE[r.stage]:(S.admin&&r.stage===2?"Review":"—")}</span></td>
      <td class="r num">${showsMoney(r)?`<span class="${r.stage>=3?"":"pendval"}">${fmt$(dv)}</span>`:"—"}</td>
      <td class="r num pctcell ${showP&&p>=100?"ok":""}">${showP?fmtPct(p):"—"}</td></tr>`;
  }).join("")}</tbody>`;
}
const FILTER_SETS = () => ({stage:S.stageSel, pct:S.pctSel, dollars:S.catSel});
const FILTER_ALL = {stage:["4","3","2","pre"],
                    pct:["met","half","under","review","none"],
                    dollars:ALLCATS};
$("ctbl").addEventListener("click",e=>{
  if(e.target.closest("a")) return;   // let folder/Chart A links navigate
  const cb=e.target.closest("input[data-fk]");
  if(cb){
    const set=FILTER_SETS()[cb.dataset.fk];
    // values may be comma lists (type mode: "A,B") — apply to every member
    cb.dataset.fv.split(",").forEach(v=>cb.checked?set.add(v):set.delete(v));
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  const fa=e.target.closest("[data-fall]");
  if(fa){
    const k=fa.dataset.fall, set=FILTER_SETS()[k];
    FILTER_ALL[k].forEach(v=>set.add(v));
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  if(e.target.closest(".fmenu")) return;               // clicks inside the menu stay put
  const fb=e.target.closest("[data-fm]");
  if(fb){ S.openMenu=S.openMenu===fb.dataset.fm?null:fb.dataset.fm; renderRight(); return; }
  const th=e.target.closest("th[data-col]");
  if(th){
    if(S.sort.col===th.dataset.col) S.sort.dir*=-1;
    else S.sort={col:th.dataset.col, dir:th.dataset.col==="county"?1:-1};
    S.openMenu=null; renderRight(); return;
  }
  const tr=e.target.closest("tr[data-cty]");
  if(tr){
    S.openMenu=null;
    // clicking the already-open county collapses it (same as ‹ Back / Esc)
    if(S.selected && S.selected.key===tr.dataset.cty) backToTable();
    else openCounty(tr.dataset.cty);
  }
});


/* ---------------- health ---------------- */
function renderHealth(){
  if(!$("hbadge")) return;                     // panel off (Admin menu)
  const items=DATA.health||[];
  const recon=DATA.reconciliation||[];
  const all=[...recon.map(r=>({code:"TABLE_A_GAP",detail:`${r.county}: Chart A ${fmt$(r.chart_a)} vs Table A ${fmt$(r.table_a)} (Δ ${fmt$(r.delta)})`})),...items];
  $("hbadge").textContent=all.length;
  $("hbadge").className="hbadge"+(all.length?"":" ok");
  $("hitems").innerHTML=all.length?all.map(i=>`<div><span class="code">${esc(i.code)}</span>${esc(i.detail)}</div>`).join(""):
    `<div class="muted">No flags. Every parsed dollar reconciles.</div>`;
}

/* ---------------- render all ---------------- */
function renderAll(){
  renderRail(); paintMap(); renderRight(); renderChartPane();
  renderTicker(); renderMovers(); renderHealth();
}
renderAll();
addEventListener("resize",()=>renderTicker());
</script>
