<style>
:root{
  /* dark: DHS navy ops room. Ramps mirror the DisasterParameters choropleths
     (stage = USWDS blues, money = PA-obligated greens), lifted for dark surfaces. */
  --bg:#0b1526; --surface:#0f1c33; --surface2:#16263f; --surface3:#1c2e4c;
  --line:#24344f; --line2:#2e4060;
  --ink:#e8ecf4; --ink2:#a3b1c7; --ink3:#6b7a94;
  --navy:#162e51; --navy2:#0b1f3a; --blue-dark:#1a4480;
  --accent:#ffbe2e; --accent-ink:#ffbe2e; --accent-dim:#b8860b;
  --s0:#2c3a54; --s1:#2f5d8f; --s2:#3b83c0; --s3:#4f97d1; --s4:#c9e2f8;
  --m0:#223250; --m1:#1f5c40; --m2:#2e8b62; --m3:#52b788; --m4:#95d5b2;
  --mrev:#ffbe2e;
  --fill-met:#3f8f68; --fill-metblue:#4f97d1; --fill-half:#7e5450; --fill-under:#c05248; --fill-rev:#9c7d22;
  --fill-pre:#24344f;
  --nonscope-fill:#0e1a2e; --nonscope-stroke:#182741;
  --map-seam:#0e1a2e; --labhalo:#0f1c33; --callbg:#e8ecf4; --callfg:#162e51;
  --ok:#62d18d; --warn:#ffb054; --crit:#ff7a76;
  --nonscope:#101c30; --nonscope-line:#1b2a44;
  --rowbar:rgba(79,151,209,.17);
  --rowbar-red:rgba(207,111,102,.22);
  --sel:#ffffff; --shadow:0 8px 28px rgba(0,0,0,.45);
}
/* MIXED boards (met + did-not-meet counties both visible): the reds firm up —
   50–99% goes nearly as dark as the old <50%, <50% a notch darker still.
   Solid enough to read as "did not meet", light enough for dark labels. */
:root[data-mixed="1"]{--fill-half:#a5514a;--fill-under:#8f4038}
:root[data-mixed="1"] .tcrow.t-half,:root[data-mixed="1"] .tam.t-half{background:rgba(180,84,74,.24)}
:root[data-mixed="1"] .tcrow.t-under,:root[data-mixed="1"] .tam.t-under{background:rgba(150,62,52,.30)}
:root[data-theme="light"]{
  /* light: the DisasterParameters DHS look — #f0f0ee page, white cards,
     navy text accents, and the exact disasterdata map ramps. */
  --bg:#f0f0ee; --surface:#f9f9f7; --surface2:#ffffff; --surface3:#eef0f2;
  --line:#dfe1e2; --line2:#c6cace;
  --ink:#1b1b1b; --ink2:#3d4551; --ink3:#565c65;
  --navy:#162e51; --navy2:#0b1f3a; --blue-dark:#1a4480;
  --accent:#ffbe2e; --accent-ink:#162e51; --accent-dim:#e5a000;
  --s0:#dde3ea; --s1:#c6dbef; --s2:#6baed6; --s3:#4292c6; --s4:#162e51;
  --m0:#eef2f7; --m1:#d8f3dc; --m2:#95d5b2; --m3:#1a9850; --m4:#0b6e3b;
  --mrev:#ffbe2e;
  --fill-met:#69b287; --fill-metblue:#5e93cc; --fill-half:#f4cbc6; --fill-under:#cf6f66; --fill-rev:#f5d97e;
  --fill-pre:#e6ebf1;
  --nonscope-fill:#f3f3f1; --nonscope-stroke:#ebebe8;
  --map-seam:#ffffff; --labhalo:#ffffff; --callbg:#162e51; --callfg:#ffffff;
  --ok:#008817; --warn:#c05600; --crit:#b50909;
  --nonscope:#f2f2f0; --nonscope-line:#e7e7e5;
  --rowbar:rgba(66,146,198,.14);
  --rowbar-red:rgba(192,82,72,.16);
  --sel:#162e51; --shadow:0 6px 20px rgba(27,27,27,.12);
}
:root[data-theme="light"][data-mixed="1"]{--fill-half:#d0736a;--fill-under:#bd5347}
:root[data-theme="light"][data-mixed="1"] .tcrow.t-half,
:root[data-theme="light"][data-mixed="1"] .tam.t-half{background:rgba(208,115,106,.30)}
:root[data-theme="light"][data-mixed="1"] .tcrow.t-under,
:root[data-theme="light"][data-mixed="1"] .tam.t-under{background:rgba(189,83,71,.34)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{
  display:flex;align-items:center;gap:16px;
  padding:8px 22px;border-bottom:3px solid var(--accent);
  background:linear-gradient(120deg,var(--navy2),var(--navy) 55%,var(--blue-dark) 130%);
  color:#fff;
}
.apptitle{font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:34px;padding:0}
.admbtn{font-weight:800;font-size:11px}
.admwrap{position:relative}
.admmenu{position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:var(--surface2);color:var(--ink2);
  border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:11px 13px;
  display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:600;min-width:220px}
.admmenu label{display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap}
.admmenu .admnote{font-size:10px;color:var(--ink3);font-weight:400;white-space:normal}
.admsep{border-top:1px solid var(--line);margin:2px 0}
/* COMPLETE boards: the admin surface is a quiet gear, not a labelled button —
   the links still need swapping, but nothing else here is live */
.admbtn.quiet{border-color:transparent;color:var(--ink3);opacity:.55;padding:5px 7px}
.admbtn.quiet:hover,.admbtn.quiet[aria-expanded="true"]{opacity:1;color:#d6deea;border-color:var(--accent)}
.admgroup{display:contents}
.admsec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:800}
.admmenu{min-width:290px;max-width:340px}
.admfield{display:flex!important;flex-direction:column;align-items:stretch!important;gap:2px;
  white-space:normal!important;font-size:11px}
.admfield input{width:100%;font:inherit;font-size:11px;padding:3px 6px;background:var(--surface3);
  color:var(--ink);border:1px solid var(--line);border-radius:5px}
.admrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.admbtn2{border:1px solid var(--line2);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;
  color:var(--ink2);background:var(--surface3);cursor:pointer;text-decoration:none;white-space:nowrap}
.admbtn2:hover{border-color:var(--accent);color:var(--ink)}
.admlink{color:var(--accent-ink)}
.evsel{
  background:rgba(255,255,255,.1);color:#fff;
  border:1px solid rgba(255,255,255,.32);border-radius:7px;
  padding:5px 10px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;max-width:60vw;
}
.evsel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.evsel option{color:#1b1b1b;background:#fff}
.evtitle{color:#fff;font-weight:700;font-size:13px;padding:0 2px;line-height:1;display:inline-flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-btn{
  border:1px solid rgba(255,255,255,.35);border-radius:7px;padding:5px 11px;font-size:12px;
  color:#d6deea;
}
.theme-btn:hover{border-color:var(--accent)}

/* ---------- layout ---------- */
.view{flex:1;min-height:0;display:grid;gap:12px;padding:10px 16px}
[hidden]{display:none!important}
.view.vtable{grid-template-columns:minmax(250px,26fr) minmax(0,37fr) minmax(300px,37fr)}
.view>*{min-height:0}
.rail{display:flex;flex-direction:column;gap:10px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding-right:2px}
.card{
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;
}
.card h3{
  margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink3);
}
.big{font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.big.gold{color:var(--accent-ink)}
.kpi-sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi-line{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink2);margin-top:7px}
.kpi-line b{font-size:15px;color:var(--ink)}

/* meter (progress to threshold) */
.meter{height:9px;background:var(--surface3);border-radius:5px;margin-top:9px;position:relative;overflow:hidden}
.meter>i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;min-width:2px}
.meter.teal>i{background:var(--m3)}
.meter .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink3);opacity:.7}
.meter .tick.goal{background:var(--ink);opacity:.95;width:2px;z-index:3}
.meter .overlane{position:absolute;top:0;bottom:0;right:0;border-radius:0 5px 5px 0;
  background:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(120,130,150,.12) 4px 8px)}
.meter>i.over{background:linear-gradient(90deg,#1f6e4a,#37a06a);box-shadow:0 0 8px rgba(63,143,104,.7);z-index:2}
.meter>i.over::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 3px,transparent 3px 7px)}
.mscale{position:relative;height:13px;font-size:9.5px;color:var(--ink3);margin-top:3px}
.mscale>span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.mscale .mover{right:2px;left:auto;transform:none;color:var(--m3);font-weight:800}

/* stage distribution stacked bar */
.stagebar{display:flex;height:13px;border-radius:4px;overflow:hidden;gap:2px;margin-top:9px;background:transparent}
.stagebar>i{display:block;min-width:0}
.legend{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.legend .row{display:flex;align-items:center;gap:7px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .n{margin-left:auto;font-weight:700;color:var(--ink)}

/* ---------- map ---------- */
.mapcard{display:flex;flex-direction:column;min-height:0}
.mapbar{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.mode{display:flex;gap:2px;background:var(--surface3);border-radius:7px;padding:3px}
.mode button{padding:3.5px 11px;border-radius:5px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.mode button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.maplegend{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--ink3);flex-wrap:wrap;justify-content:flex-end}
.maplegend>span{white-space:nowrap}
.maplegend .sw{width:13px;height:9px;border-radius:2px;display:inline-block;vertical-align:-1px}
#map{flex:1;min-height:0}
#map svg{width:100%;height:100%;display:block;margin:0 auto}
.ctylab{font-weight:700;fill:var(--ink);text-anchor:middle;pointer-events:none;display:none;paint-order:stroke fill;stroke:var(--labhalo);stroke-width:2.6px;stroke-linejoin:round}
.ctylab.on{display:block}
/* per-county value labels under the $ Validated / Applicants choropleth */
.ctyval{font-weight:800;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke fill;stroke:var(--labhalo);stroke-linejoin:round}
.maptotals{display:flex;gap:24px;justify-content:center;align-items:baseline;padding:7px 4px 0;font-size:12px;color:var(--ink2);flex-wrap:wrap;flex:none}
.maptotals b{color:var(--ink);font-size:13.5px}
.mapcard{position:relative}
.mapchips{position:absolute;top:10px;left:12px;z-index:5;display:flex;gap:6px}
.catcol.unsel{opacity:.32}
.catpeek .catcol{cursor:pointer}
.tcrow.t-met.blue{background:rgba(79,151,209,.15)}
:root[data-theme="light"] .tcrow.t-met.blue{background:rgba(94,147,204,.20)}
.cty{stroke:var(--map-seam);stroke-width:1.2;cursor:pointer;stroke-linejoin:round}
.cty.nonscope{fill:var(--nonscope-fill)!important;stroke:var(--map-seam);stroke-width:1;cursor:default}
.cty.hover{stroke:var(--sel);stroke-width:2.2}
.cty.selected{stroke:var(--sel);stroke-width:2.6}
.cty.dimmed{opacity:.22}
.maplegend{margin:8px 0 0;justify-content:center}
.chip{
  padding:4px 11px;border-radius:15px;font-size:11.5px;font-weight:600;
  background:var(--surface3);border:1px solid var(--line2);color:var(--ink2);
}
.chip:hover{border-color:var(--accent)}
.chip.selected{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .amt{color:var(--accent-ink);font-weight:700;margin-left:5px}

/* tooltip */
#tip{
  position:fixed;z-index:40;pointer-events:none;display:none;max-width:290px;
  background:var(--surface2);border:1px solid var(--line2);border-radius:9px;
  box-shadow:var(--shadow);padding:10px 13px;font-size:12px;line-height:1.5;
}
#tip .t-name{font-weight:800;font-size:13.5px;display:flex;gap:8px;align-items:center;justify-content:space-between}
#tip .t-stage{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;white-space:nowrap}
#tip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
#tip .t-row b{color:var(--ink)}
#tip .t-muted{color:var(--ink3);font-size:11px;margin-top:3px}

/* ---------- right panel ---------- */
.panel{display:flex;flex-direction:column;gap:12px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
.panel .empty{
  border:1.5px dashed var(--line2);border-radius:12px;padding:38px 22px;text-align:center;
  color:var(--ink3);font-size:13px;
}
.p-head{display:flex;align-items:start;gap:10px}
.p-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.p-head .ev{font-size:11px;color:var(--ink3)}
.p-close{margin-left:auto;color:var(--ink3);font-size:17px;padding:2px 8px;border-radius:6px}
.p-close:hover{background:var(--surface3);color:var(--ink)}
.stagechip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:10px;letter-spacing:.04em;white-space:nowrap}
.p-kv{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}
.p-kv b{color:var(--ink2);font-weight:600}
.p-money .amount{font-size:27px;font-weight:800;letter-spacing:-.02em}
.p-money .vs{font-size:11.5px;color:var(--ink3);margin-top:1px}
.tierchip{font-size:10.5px;font-weight:800;padding:2.5px 8px;border-radius:9px;margin-left:8px;vertical-align:3px}
.tier-met_100{background:var(--accent);color:#1b1b1b}
.tier-met_50{background:var(--m2);color:#fff}
.tier-under{background:var(--surface3);color:var(--ink2);border:1px solid var(--line2)}
.tier-zero,.tier-unknown{background:var(--surface3);color:var(--ink3)}
.split{display:flex;height:11px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0 3px}
.split i{display:block}
.split-legend{display:flex;gap:14px;font-size:11px;color:var(--ink3)}
.split-legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}

/* cat bars */
/* right panel: scope band + spreadsheet table <-> Chart A explorer */
.rightpanel{display:flex;flex-direction:column;min-height:0;padding:12px 14px}
.rpbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.scopeband{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.scopeband .sb-title{font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.scopeband .sb-bar{flex:1;min-width:120px;display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.scopeband .sb-bar i{display:block}
.scopeband .sb-chips{display:flex;gap:5px;flex-wrap:wrap}
.sbchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;
  color:var(--ink2);border:1px solid var(--line2);cursor:pointer;background:var(--surface2)}
.sbchip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sbchip b{font-weight:800;color:var(--ink)}
.sbchip[aria-pressed="true"]{background:var(--surface3);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scopeband .sb-extra{font-size:11px;color:var(--ink3);white-space:nowrap}

table.ctbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.ctbl col.c-county{width:31%}table.ctbl col.c-stage{width:24%}table.ctbl col.c-val{width:23%}table.ctbl col.c-pct{width:22%}
table.ctbl td{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ctbl th{position:sticky;top:0;z-index:2;background:var(--surface2);text-align:left;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:8px 8px;border-bottom:2px solid var(--line2);
  cursor:pointer;user-select:none;white-space:nowrap}
table.ctbl th.r,table.ctbl td.r{text-align:right}
table.ctbl th .arr{color:var(--accent-ink)}
table.ctbl td{padding:6.5px 8px;border-bottom:1px solid var(--line)}
table.ctbl tr.crow{cursor:pointer}
table.ctbl tr.crow:hover td{background:var(--surface3)}
table.ctbl tr.selected td{background:var(--surface3);box-shadow:inset 2px 0 0 var(--accent)}
table.ctbl .pctcell{white-space:nowrap;color:var(--ink3)}
table.ctbl .pctcell.ok{color:var(--ok);font-weight:800}
.stagetag{font-size:9.5px}

/* Chart A explorer (inside the right panel) — SLIDES OVER the county list
   so it reads as a window sliding in; ‹ Back (top left) slides it back out */
.chartexp{display:flex;flex-direction:column;gap:10px;animation:slideInR .3s ease-out}
@keyframes slideInR{from{transform:translateX(52%);opacity:0}to{transform:none;opacity:1}}
@keyframes slideInL{from{transform:translateX(-40%);opacity:0}to{transform:none;opacity:1}}
#rpTable.slideback{animation:slideInL .28s ease-out}
.rightpanel{overflow:hidden}
/* fill-up on load/open: base bar grows first, overflow/held extend after it */
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.thermo .segc.grow,.meter>i.grow{transform-origin:left center;animation:growX .8s cubic-bezier(.22,.61,.36,1) both}
.thermo .segover.grow2,.thermo .segh.grow2,.meter>i.over.grow2{transform-origin:left center;animation:growX .55s cubic-bezier(.22,.61,.36,1) .78s both}
.selbar{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:3;background:var(--surface2);padding-bottom:6px}
.backbtn{font-size:12px;font-weight:800;color:var(--accent-ink);padding:5px 10px;border:1px solid var(--line2);border-radius:7px;white-space:nowrap}
.backbtn:hover{background:var(--surface3)}
.selrow{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto 90px 56px 16px;align-items:center;gap:8px;
  text-align:left;padding:6.5px 10px;border-radius:8px;background:var(--surface3);font-size:13px;cursor:pointer;
  box-shadow:inset 2px 0 0 var(--accent)}
.selrow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selrow .sv{text-align:right;color:var(--ink2);font-weight:700}
.selrow .sp{text-align:right;color:var(--ink3);font-size:12px}
.selrow .sp.ok{color:var(--ok);font-weight:800}
.selrow .chev{color:var(--ink3);font-size:11px;text-align:right}
.chartexp>.card,.chartexp>details.card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px 4px}
details.sub>summary{cursor:pointer;list-style:none;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
details.sub>summary::before{content:"▸";font-size:11px}
details.sub[open]>summary::before{content:"▾"}
details.sub>summary::-webkit-details-marker{display:none}
details.sub[open]>summary{margin-bottom:8px}
.histlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:11.5px}
.histlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:5px 8px;background:var(--surface3);border-radius:7px}
.histlist li b{text-align:right}
.histlist .dis{grid-column:1 / -1;font-size:10.5px;color:var(--ink3)}

/* threshold clock (donation-thermometer treatment) */
.thermo{position:relative;height:30px;background:var(--surface3);border-radius:15px;overflow:hidden;margin-top:10px}
.thermo.over{height:40px;border-radius:20px}
.thermo .seg{position:absolute;top:0;bottom:0}
.thermo .segc{left:0;border-radius:15px 0 0 15px;min-width:5px}
.thermo .segc::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(-55deg,rgba(255,255,255,.16) 0 7px,transparent 7px 14px)}
.thermo .segc.r{background:linear-gradient(90deg,#a84a44,#d97d76)}
.thermo .segc.y{background:linear-gradient(90deg,#d99a00,#ffc94a)}
.thermo .segc.g{background:linear-gradient(90deg,#2f7f5a,#7fc79a)}
.thermo.over .segc.g{box-shadow:0 0 12px rgba(63,143,104,.6)}
.thermocall{position:absolute;top:50%;transform:translate(-50%,-50%);z-index:2;
  background:var(--callbg);color:var(--callfg);font-size:9px;font-weight:800;
  padding:2.5px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
.thermo .segh{background:var(--mrev);opacity:.35}
.thermo .t75{position:absolute;top:0;bottom:0;width:2px;background:var(--accent-ink);opacity:.85}
.thermo .overlane{position:absolute;top:0;bottom:0;right:0;border-radius:0 15px 15px 0;
  background:repeating-linear-gradient(-45deg,transparent 0 5px,rgba(120,130,150,.10) 5px 10px)}
.thermo .segover{background:linear-gradient(90deg,#1f6e4a,#37a06a);border-radius:0;z-index:1;
  box-shadow:0 0 11px rgba(63,143,104,.75)}
.thermo .segover::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 9px)}
.thermo .tgoal{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink);opacity:.95;z-index:3}
.thermo .tgoal::after{content:"100%";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:8.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
.thermocall.g{background:var(--m3)}
.thermo-scale{position:relative;height:15px;font-size:9.5px;color:var(--ink3);margin-top:6px}
.thermo-scale .s0{position:absolute;left:2px}
.thermo-scale .sm{position:absolute;transform:translateX(-50%);white-space:nowrap}
.thermo-scale .sgoal{color:var(--ink2);font-weight:800}
.thermo-scale .sover{position:absolute;right:2px;color:var(--m3);font-weight:800}

/* compact vertical Cat A-G column chart */
.catcols{display:flex;align-items:flex-end;gap:5px;margin-top:12px}
.catcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.catcol i{width:100%;max-width:26px;background:var(--m3);border-radius:3px 3px 0 0}
.catcol .cl{font-size:9.5px;font-weight:800;color:var(--ink3)}
.catcol .cv{font-size:8.5px;color:var(--ink2);font-weight:600;min-height:11px;white-space:nowrap}
.catcol.zero i{background:var(--surface3);height:2px!important}
.catcol.zero .cl{color:var(--line2)}
/* the chart re-scopes (state -> county -> applicant): bars grow up + the
   scheme shifts so the change is unmistakable */
.catcol i.cgrow{transform-origin:center bottom;animation:growY .45s cubic-bezier(.22,.61,.36,1) both}
/* Categories of Work card: metric toggles + the viz flipper */
.catmode{display:flex;gap:6px;margin-top:9px}
.vizrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.viznav{display:flex;gap:3px;align-items:center;flex:none}
.viznav button{width:22px;height:20px;border:1px solid var(--line2);border-radius:5px;
  font-size:12px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;padding:0}
.viznav button:hover{border-color:var(--accent);color:var(--ink)}
.vizname{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);min-width:58px;text-align:center}
/* pie */
.catpie{display:flex;justify-content:center;margin-top:10px}
.catpie path,.catpie circle.wedge{cursor:pointer;stroke:var(--surface2);stroke-width:1.5}
.catpie .unselw{opacity:.32}
.pielab{font-size:11px;font-weight:800;pointer-events:none}
/* stacked horizontal bar */
.catstack{display:flex;height:30px;border-radius:7px;overflow:hidden;margin-top:14px;background:var(--surface3)}
.catstack i{display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:10px;font-weight:800;min-width:3px;overflow:hidden;white-space:nowrap}
.catstack i.unsel{opacity:.32}
.catstack.cgrow{transform-origin:left center;animation:growX .45s cubic-bezier(.22,.61,.36,1) both}
/* per-category rows */
.cathrows{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.cathrow{display:grid;grid-template-columns:minmax(20px,auto) minmax(0,1fr) 62px;gap:8px;align-items:center;cursor:pointer;border-radius:5px}
.cathrow:hover{background:var(--surface3)}
.cathrow.unsel{opacity:.32}
.cathrow .crl{font-size:10px;font-weight:800;color:#fff;border-radius:4px;text-align:center;padding:2px 0}
.cathrow .crtrack{height:11px;background:var(--surface3);border-radius:5px;overflow:hidden;position:relative}
.cathrow .crtrack i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.cathrow .crtrack i.cgrow{transform-origin:left center;animation:growX .45s cubic-bezier(.22,.61,.36,1) both}
.cathrow .crv{font-size:10px;font-weight:700;color:var(--ink2);text-align:right}
.mt-cat b{font-size:13.5px}
/* Categories of Work: the scope line — which level is charted */
.cwscope{font-size:13.5px;font-weight:800;letter-spacing:-.01em;color:var(--accent-ink);margin-top:1px}

/* hero $ / threshold + the ? explainer */
.heroline{display:flex;align-items:baseline;gap:7px;margin-top:9px;flex-wrap:wrap}
.hero{font-size:25px;font-weight:800;letter-spacing:-.02em;color:var(--accent-ink)}
.herosep{color:var(--ink3);font-size:17px}
.herothr{font-size:17px;font-weight:700;color:var(--ink2);white-space:nowrap}
.p-insp{font-size:11.5px;color:var(--ink2)} .p-insp b{font-weight:700}
.q{position:relative;display:inline-flex;margin-left:2px;align-self:center}
.q .qmark{cursor:help;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--ink3);color:var(--ink3);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.q:hover .qmark,.q:focus-within .qmark{background:var(--accent);border-color:var(--accent);color:#162e51}
.q .qpop{display:none}
.q:hover .qpop,.q:focus-within .qpop{display:flex}
.qpop a{color:var(--accent-ink);font-weight:700;text-decoration:underline}
.qpop{position:absolute;z-index:30;left:-190px;top:24px;width:300px;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:11px 13px;font-size:11.5px;color:var(--ink2);display:flex;flex-direction:column;gap:7px;line-height:1.5;text-align:left}
.qpop b{color:var(--ink)}
.qpop .qquote{font-style:italic;background:var(--surface3);border-left:3px solid var(--accent);padding:7px 9px;border-radius:0 6px 6px 0}
.qpop .cite{font-style:normal;font-size:10px;color:var(--ink3)}
.chk.ok{color:var(--ok)} .chk.no{color:var(--crit)}
details.guidequote{margin-top:9px}
details.guidequote summary{cursor:pointer;list-style:none;font-size:11.5px;font-weight:700;color:var(--accent-ink)}
details.guidequote summary::-webkit-details-marker{display:none}
details.guidequote blockquote{margin:7px 0 0;padding:8px 11px;background:var(--surface3);border-left:3px solid var(--accent);font-size:11px;color:var(--ink2);line-height:1.55;border-radius:0 6px 6px 0}
details.guidequote .cite{font-size:10px;color:var(--ink3);margin-top:5px}
/* threshold-clock tier table: 3 rows x 4 aligned columns */
.tcgrid{display:flex;flex-direction:column;gap:3px;margin-top:12px}
.tcrow{display:grid;grid-template-columns:50px 82px minmax(0,1fr) auto;gap:6px;align-items:center;
  text-align:left;padding:5px 6px;border-radius:8px;border:1px solid transparent;cursor:pointer;font-size:11px}
.tcrow.on{border-color:var(--accent);background:var(--surface3)}
.tcrow .tlab{font-weight:800;color:var(--ink2);font-size:10.5px}
.tcrow .tval{color:var(--ink);font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.tcrow .tcty{text-align:right;color:var(--ink3);font-weight:700;white-space:nowrap;font-size:10px}
.pill{font-size:8px;font-weight:800;letter-spacing:.04em;padding:2.5px 6px;border-radius:999px;white-space:nowrap;text-align:center;justify-self:start}
.pill.ok{background:rgba(0,150,60,.16);color:var(--ok)}
.pill.no{background:rgba(190,30,30,.14);color:var(--crit)}
.pill.pre{background:rgba(128,142,162,.2);color:var(--ink2)}
.pill.rev{background:rgba(255,190,46,.24);color:#8a6408}
:root:not([data-theme="light"]) .pill.rev{color:#ffd34d}
.tcrow.t-rev{background:rgba(255,190,46,.10)}
:root[data-theme="light"] .tcrow.t-rev{background:rgba(245,217,126,.30)}
.tcrow.t-met{background:rgba(63,143,104,.14)}
.tcrow.t-half{background:rgba(228,120,110,.10)}
.tcrow.t-under{background:rgba(228,87,79,.16)}
.tcrow.t-pre{background:rgba(128,142,162,.10)}
:root[data-theme="light"] .tcrow.t-met{background:rgba(147,203,164,.26)}
:root[data-theme="light"] .tcrow.t-half{background:rgba(242,198,194,.30)}
:root[data-theme="light"] .tcrow.t-under{background:rgba(221,139,132,.26)}
:root[data-theme="light"] .tcrow.t-pre{background:rgba(160,175,195,.18)}
.tcrow:hover{filter:brightness(.96)}
.pendval{font-style:italic;color:var(--ink2)}
.tbdnote{font-size:9px;color:var(--ink3)}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.2;vertical-align:middle}
.frac .fn{font-weight:800;color:var(--ink);font-size:9.5px}
.frac .fd{border-top:1.5px solid var(--ink3);padding-top:1px;color:var(--ink2);font-size:9.5px}
.fpct{font-weight:800;color:var(--ink2);font-size:10px}
.buff{color:var(--ok);font-weight:800}
.tcfoot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)}
.tcfoot b{color:var(--ink)}
.clockcols{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:8px;margin-top:11px}
.clockcols .cl{display:block;font-size:8.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.clockcols b{font-size:11px;line-height:1.4;display:block;color:var(--ink)}
.tierchart{display:flex;gap:6px;align-items:flex-end;margin-top:12px}
.tiercol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:5px 2px 4px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.tiercol:hover{background:var(--surface3)}
.tiercol.on{border-color:var(--accent);background:var(--surface3)}
.tiercol i{width:100%;max-width:36px;border-radius:3px 3px 0 0}
.tiercol[data-tier="met"] i{background:var(--fill-met)}
.tiercol[data-tier="half"] i{background:var(--fill-half)}
.tiercol[data-tier="under"] i{background:var(--fill-under)}
.tiercol .tv{font-size:9.5px;font-weight:800;color:var(--ink2)}
.tiercol .tl{font-size:9px;font-weight:800;color:var(--ink3)}
.tiercol .tn{font-size:8.5px;color:var(--ink3);white-space:nowrap}
.fbtn{margin-left:5px;font-size:9.5px;font-weight:800;color:var(--ink2);background:var(--surface3);border:1px solid var(--line2);border-radius:4px;padding:2px 6px;vertical-align:1px;white-space:nowrap}
.fbtn:hover{border-color:var(--accent)}
.fbtn.on{background:var(--accent);color:#162e51;border-color:var(--accent)}
.fmenu{position:absolute;top:100%;left:0;z-index:9;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:9px 11px;display:flex;flex-direction:column;gap:6px;font-size:11px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink2);min-width:180px;cursor:default}
.fmenu label{display:flex;gap:7px;align-items:center;cursor:pointer;white-space:nowrap}
.fall{align-self:flex-start;font-size:10px;color:var(--accent-ink);font-weight:700}
.fstage{margin-left:6px;font-size:8.5px;padding:2px 6px}

/* applicant comment blocks — Chart A formatting preserved */
details.fold summary{cursor:pointer;list-style:none;font-size:10.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);display:flex;align-items:center;gap:8px}
details.fold summary::before{content:"▸";font-size:11px;transition:none}
details.fold[open] summary::before{content:"▾"}
details.fold summary::-webkit-details-marker{display:none}
details.fold>svg,details.fold>.mv{margin-top:10px}
.srcbadge{margin-left:7px;font-size:8px;font-weight:800;letter-spacing:.08em;background:var(--accent);color:#162e51;border-radius:4px;padding:2px 5px;vertical-align:1px}
.stgnote{margin-left:6px;font-size:9.5px;color:var(--ink3);font-weight:600}
.file.issrc{background:var(--surface3);box-shadow:inset 2px 0 0 var(--accent);border-radius:7px}
.fic{font-size:8px;font-weight:800;letter-spacing:.04em;color:#fff;border-radius:4px;padding:2.5px 4px;flex:none;line-height:1}
.fic-x{background:#1a7340}.fic-p{background:#b02a37}.fic-d{background:#1a4480}.fic-m{background:#8a5ca8}
.fic-i{background:#c05600}.fic-t{background:#c2571a}.fic-o{background:#6c757d}
.fic-dir{background:var(--accent);color:#1b1b1b}

/* county file tree — the SharePoint folder as it really is */
.ftree{display:flex;flex-direction:column;gap:1px;font-size:12px}
.ftdir>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:7px;
  padding:4px 6px;border-radius:7px;color:var(--ink2);font-weight:700}
.ftdir>summary::-webkit-details-marker{display:none}
.ftdir>summary::before{content:"▸";font-size:10px;color:var(--ink3);flex:none;width:8px}
.ftdir[open]>summary::before{content:"▾"}
.ftdir>summary:hover{background:var(--surface3)}
.ftname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftn{font-size:10px;color:var(--ink3);font-weight:600;white-space:nowrap}
.ftopen{margin-left:auto;font-size:10px;font-weight:800;color:var(--accent-ink);
  text-decoration:none;flex:none;opacity:0;transition:opacity .1s}
.ftdir>summary:hover .ftopen,.ftopen:focus-visible{opacity:1}
.ftkids{margin-left:11px;padding-left:8px;border-left:1px solid var(--line);
  display:flex;flex-direction:column;gap:1px}
.chartalink{display:inline-block;margin:0 0 9px;padding:5px 11px;border-radius:7px;
  background:var(--accent);color:#1b1b1b;font-weight:800;font-size:11.5px;text-decoration:none}
.chartalink:hover{filter:brightness(1.07)}
.appcomment{font-size:11.5px;line-height:1.55;color:var(--ink2);background:var(--surface3);border-radius:7px;padding:8px 11px;margin:2px 0 7px}

/* applicants */
.apps{width:100%;border-collapse:collapse;font-size:12.5px}
.apps th{
  text-align:left;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);padding:3px 6px;border-bottom:1px solid var(--line);position:relative}
.apps th .fmenu{right:0;left:auto;text-align:left}
.apps td{padding:6px;border-bottom:1px solid var(--line)}
.apps tr.app{cursor:pointer}
.apps tr.app:hover td{background:var(--surface3)}
/* the ACTIVE applicant (its A–G breakdown is on the rail chart) */
.apps tr.app.sel td{background:var(--surface3)}
.apps tr.app.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.appmark{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:6px;vertical-align:0}
.apps .apx{display:inline-block;margin-right:6px;color:var(--ink3);font-size:10px}
.apps tr.app.open .apx{transform:rotate(90deg)}
.apps td.r{text-align:right}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:0}
.dot.complete{background:var(--ok)}.dot.in_progress{background:var(--warn)}
.dot.blank,.dot.other{background:var(--ink3)}
.comment td{padding:0;border:0}
.flagchips{display:flex;flex-wrap:wrap;gap:6px}
.flagchip{font-size:10.5px;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:9px;padding:2px 8px;opacity:.9}

/* files */
.files{display:flex;flex-direction:column;gap:2px;font-size:12px}
.file{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:7px;text-decoration:none;color:var(--ink2)}
a.file:hover{background:var(--surface3);color:var(--ink)}
.file .ic{flex:none;width:17px;text-align:center}
.file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.file .meta{flex:none;color:var(--ink3);font-size:10.5px}
.file.nolink{cursor:help}
.morebtn{align-self:start;font-size:11.5px;color:var(--accent-ink);font-weight:700;padding:4px 7px}
.sp-open{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--accent-ink);text-decoration:none}
.sp-open:hover{text-decoration:underline}
.linknote{font-size:10.5px;color:var(--ink3);margin-top:6px}

/* history (static OpenFEMA snapshot) */
.hroll{font-size:12px;color:var(--ink2);margin:2px 0 10px;line-height:1.6}
.hroll b{color:var(--ink);font-size:13px}
.httl{width:100%;height:auto;display:block;margin:2px 0 2px}
.htax{stroke:var(--ink3);stroke-width:1}
.htbar.a{fill:var(--blue-dark)}
.htbar.p{fill:var(--m3)}
.htn{font-size:10px;font-weight:700;fill:var(--ink2)}
.htn.p{fill:var(--m3)}
.htdnl{font-size:9.5px;font-weight:700;fill:var(--ink2)}
.htyr2{font-size:9px;fill:var(--ink3)}
.htkey{display:flex;gap:14px;font-size:10.5px;color:var(--ink3);margin:0 0 10px}
.htkey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.htleg{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px}
.htlrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2)}
.htlrow .htdn{flex:none;font-weight:700;color:var(--accent-ink);min-width:62px}
.htlrow .htdn.em{color:var(--ink3)}
.htlrow .htd{flex:none;color:var(--ink3);min-width:86px}
.htlrow .htt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.htlrow .hta{flex:none;color:var(--ink3)}
.htlrow b{flex:none;color:var(--ink)}
.hah{margin:10px 0 4px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3)}
.halist{display:flex;flex-direction:column}
.ha{display:grid;grid-template-columns:minmax(110px,30%) 1fr 64px;gap:8px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line)}
.ha:last-child{border-bottom:0}
.ha .han{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.ha .had{color:var(--ink3);min-width:0;overflow-wrap:anywhere}
.ha b{color:var(--ink);text-align:right}

/* ---------- bottom ---------- */
.bottom{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;padding:0 22px 14px}
@media (max-width:1120px){.bottom{grid-template-columns:1fr}}
#ticker{width:100%;height:190px}
.mv{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto;scrollbar-width:thin}
.mv .m{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:5px 8px;border-radius:7px;background:var(--surface3)}
.mv .m .cty-n{font-weight:700}
.mv .up{color:var(--ok);font-weight:700}
.mv .dn{color:var(--crit);font-weight:700}
.mv .st{color:var(--accent-ink);font-weight:700}
.mv .none{color:var(--ink3);font-size:12px;padding:8px}

/* county table */
.tablewrap{padding:0 22px 8px}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
table.main{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
table.main th{
  position:sticky;top:0;background:var(--surface2);text-align:left;font-size:10px;
  font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer;user-select:none;white-space:nowrap}
table.main th.r,table.main td.r{text-align:right}
table.main th .arr{color:var(--accent-ink)}
table.main td{padding:8px 12px;border-bottom:1px solid var(--line)}
table.main tr.cty-row{cursor:pointer}
table.main tr.cty-row:hover td{background:var(--surface3)}
table.main tr.selected td{background:var(--surface3);box-shadow:inset 2px 0 0 var(--accent)}
.stagetag{font-size:10.5px;font-weight:800;padding:2.5px 8px;border-radius:9px;white-space:nowrap}
.pct-cell{white-space:nowrap}
.pct-strip{display:inline-block;width:64px;height:7px;background:var(--surface3);border-radius:4px;margin-right:8px;vertical-align:1px;position:relative;overflow:hidden}
.pct-strip i{position:absolute;inset:0 auto 0 0;background:var(--m3);border-radius:4px}
.pct-strip.over i{background:var(--accent)}
.muted{color:var(--ink3)}
.notouch{color:var(--crit);font-weight:600}

/* health + footer */
.healthwrap{padding:0 22px 12px}
details.health{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 16px}
details.health summary{cursor:pointer;font-weight:700;font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:9px}
details.health summary::-webkit-details-marker{display:none}
.hbadge{background:var(--warn);color:#1b1b1b;font-weight:800;font-size:11px;border-radius:9px;padding:1px 8px}
.hbadge.ok{background:var(--ok)}
.hitems{margin:10px 0 2px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.hitems .code{font-weight:700;color:var(--warn);margin-right:7px}
footer{padding:10px 22px 26px;font-size:11px;color:var(--ink3);display:flex;gap:18px;flex-wrap:wrap}
.folderlink{color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:11.5px}
.folderlink:hover{text-decoration:underline}

/* ===== COMPLETE-mode rail: vertical threshold bar, Table A panel, counties ===== */
#railTop{display:flex;flex-direction:column;gap:10px}
.railcty{display:flex;flex-direction:column;padding:12px 14px}
.railcty .rpbody{flex:none;overflow:visible}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes morphIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.morph{animation:morphIn .32s ease-out}
.vwrap{display:flex;gap:16px;align-items:stretch;margin-top:10px}
/* clean LINEAR bar: navy fill up to the 100% line, GOLD overage above it —
   the track spans max(validated, indicator), so being 3× over puts the 100%
   line a third of the way up (commensurate, never "just a little over") */
.vbar{position:relative;flex:none;width:60px;height:204px;background:var(--surface3);border-radius:10px}
/* top card: the PDA title + incident period lockup, and BIG count numbers */
.pdatitle{font-size:16.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.25}
.pdaper{font-size:11.5px;color:var(--ink3);margin-top:2px}
.vstat.big2 b{font-size:21px;letter-spacing:-.02em}
.vstat.big2{line-height:1.3}
.vstat.okst b{color:var(--ok)}
/* "Dollars by CATEGORY|TYPE" — the word itself is the toggle */
.catgroupbtn{font:inherit;font-weight:800;letter-spacing:inherit;text-transform:inherit;
  color:var(--accent-ink);border:1px solid var(--line2);border-radius:5px;padding:0 6px;cursor:pointer}
.catgroupbtn:hover{border-color:var(--accent)}
.vbar i{position:absolute;left:0;right:0;bottom:0;display:block}
.vbar i.vfill{border-radius:0 0 10px 10px;min-height:3px;
  background:linear-gradient(0deg,#0f2747,#2f6ea8);
  box-shadow:0 0 10px rgba(47,110,168,.30)}
.vbar i.vover{border-radius:10px 10px 0 0;
  background:linear-gradient(0deg,#c9992b,#ffd34d);
  box-shadow:0 0 12px rgba(255,190,46,.45)}
.vbar .vgoal{position:absolute;left:-5px;right:-5px;height:3px;background:var(--ink);opacity:.95;z-index:3;border-radius:2px}
.vbar .vcall{position:absolute;left:50%;transform:translate(-50%,50%);z-index:4;
  background:var(--callbg);color:var(--callfg);font-size:9px;font-weight:800;
  padding:2.5px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;
  box-shadow:0 1px 4px rgba(0,0,0,.28)}
.vbar i.grow{transform-origin:center bottom;animation:growY .8s cubic-bezier(.22,.61,.36,1) both}
.vbar i.grow2{transform-origin:center bottom;animation:growY .55s cubic-bezier(.22,.61,.36,1) .78s both}
.vstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center;
  font-size:11px;color:var(--ink3)}
.vstat b{font-size:13px;color:var(--ink);font-weight:800}
.vstat.lead b{font-size:16px;color:var(--accent-ink)}
.vstat.warn b{color:var(--crit)}
.chartalink.sm{padding:4px 10px;font-size:10.5px;margin:5px 0 0;align-self:flex-start}
.chartalink.inert{opacity:.6;cursor:help}
/* Table A panel: compact tier rows (no pills, no repeated totals) */
.tamini{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.tam{display:grid;grid-template-columns:50px auto minmax(0,1fr) auto;gap:6px;align-items:center;
  text-align:left;padding:4.5px 7px;border-radius:7px;border:1px solid transparent;font-size:11px}
button.tam{cursor:pointer}
button.tam:hover{filter:brightness(.96)}
.tam.on{border-color:var(--accent);background:var(--surface3)}
.tam .tl{font-weight:800;color:var(--ink2);font-size:10.5px}
.tam b{color:var(--ink);font-weight:700}
.tam .tc{text-align:right;color:var(--ink3);font-weight:700;font-size:10px;white-space:nowrap}
/* counties card: link bar under the selected row */
tr.linkrow td{padding:6px 8px 9px;background:var(--surface3);box-shadow:inset 2px 0 0 var(--accent)}
tr.linkrow .lb{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
tr.linkrow .chartalink.sm{margin:0}
/* map zoom-to-county (COMPLETE): strokes stay screen-width, labels re-render
   at a zoom-compensated font so names stay readable (never hidden) */
.zoomg{transition:transform .55s cubic-bezier(.22,.61,.36,1)}
.zoomed .cty{vector-effect:non-scaling-stroke}
/* COMPLETE: the rail is two cards (Thresholds + Table A) — the county table
   lives in the RIGHT panel like the live board (still proportional fr) */
body[data-complete="1"] .view.vtable{
  grid-template-columns:minmax(290px,27fr) minmax(0,37fr) minmax(300px,36fr)}
/* county files: the county-folder root link */
.ftroot{display:flex;align-items:center;gap:7px;margin:0 0 7px;padding:5px 6px;border-radius:7px;
  color:var(--ink2);font-weight:700;font-size:12px;text-decoration:none}
.ftroot:hover{background:var(--surface3)}
.ftroot .ftn{margin-left:auto;color:var(--accent-ink)}
details.fold.hist>summary{padding:2px 0}
details.fold.hist[open]>summary{margin-bottom:8px}
</style>
</head>
<body>
<header>
  <span class="apptitle">PA PDA Summary Dashboard</span>
  <select id="eventSel" class="evsel" aria-label="PDA and incident period"></select>
  <span style="margin-left:auto"></span>
  <div class="admwrap">
    <button class="theme-btn admbtn" id="adminBtn" aria-expanded="false" aria-label="Admin">Admin ▾</button>
    <div class="admmenu" id="admMenu" hidden>
      <div class="admgroup" id="grpPanels">
        <label id="rowPending"><input type="checkbox" id="ckPending"> Pending $ <span class="admnote">unvalidated amounts + TBD fills</span></label>
        <label><input type="checkbox" id="ckTicker"> Validated $ over time</label>
        <label><input type="checkbox" id="ckMovers"> Movers</label>
        <label><input type="checkbox" id="ckHealth"> Data health</label>
        <div class="admsep"></div>
      </div>
      <div class="admgroup" id="grpLinks">
      <div class="admsec">SharePoint links</div>
      <label class="admfield">Site base <span class="admnote">from query.iqy</span>
        <input type="text" id="spInput" placeholder="https://…sharepoint.com" spellcheck="false"></label>
      <label class="admfield" id="rowPdaFolder" hidden>PDA folder <span class="admnote">this PDA's folder under a library-wide query</span>
        <input type="text" id="pfInput" list="pfList" spellcheck="false" placeholder="e.g. MI PDA May 2026">
        <datalist id="pfList"></datalist></label>
      <label class="admfield">County folder base <span class="admnote">county link = base/County</span>
        <input type="text" id="mfInput" placeholder="https://…/Damage Data/Counties" spellcheck="false"></label>
      <div class="admrow">
        <label class="admbtn2" id="iqyLabel" tabindex="0">Load query.iqy…<input type="file" id="iqyInput" accept=".iqy,.txt,text/plain" hidden></label>
        <button class="admbtn2" id="lnkReset" type="button">Reset</button>
        <a class="admbtn2 admlink" id="lnkOpen" href="#" target="_blank" rel="noopener" hidden>Open PDA folder ↗</a>
      </div>
      <div class="admnote" id="lnkNote"></div>
      </div>
      <div class="admsep"></div>
      <div class="admsec">Export — CSV for Power BI</div>
      <div class="admrow">
        <button class="admbtn2" id="csvCounties" type="button" title="One row per county × incident period (excluded counties flagged) — flat columns, plain numbers, ISO dates">Counties</button>
        <button class="admbtn2" id="csvApplicants" type="button" title="One row per applicant × county, Cat A–G split out — flat columns, plain numbers">Applicants</button>
        <button class="admbtn2" id="csvSummary" type="button" title="One-row PDA summary (indicators, totals, incident period)">Summary</button>
      </div>
    </div>
  </div>
  <button class="theme-btn iconbtn" id="themeBtn" aria-label="Toggle light / dark theme"></button>
</header>

<main class="view vtable" id="viewTable">
  <aside class="rail" id="rail">
    <div id="railTop"></div>
  </aside>

  <section class="card mapcard">
    <div id="map" aria-label="County map"></div>
    <div class="maptotals" id="mapTotals" hidden></div>
  </section>

  <section class="card rightpanel">
    <div class="scopeband" id="scopeband"></div>
    <div class="rpbody" id="rpTable"><table class="ctbl" id="ctbl"></table></div>
    <div class="rpbody chartexp" id="rpChart" hidden></div>
  </section>
</main>

<footer>
  <span><b>Unofficial working tool.</b> Figures are recomputed from the source Chart A workbooks — verify before external use. Not a declaration determination.</span>
  <span id="footMeta"></span>
</footer>

<div id="tip"></div>

// the same fields in the browser. Paths are server-relative so a new host or
// root folder re-points every file link without a rebuild.
const LINKS = DATA.links || {sharepoint_base: (DATA.pda||{}).sharepoint_base || "",
                             master_folder: DATA.master_folder || ""};
const S = {

  panels: {ticker:false, movers:false, health:false},   // Admin-menu optional panels

  openMenu: null,          // which column filter menu is open
  sort: {col: COMPLETE ? "dollars" : "stage", dir:-1},
  selected: null,          // {type:"county", key}
  spBase: (LINKS.sharepoint_base || ""),   // SharePoint site host — file links
  masterFolder: DATA.master_folder || "",  // county-folder base — county links

  mfAssumed: null,         // county folder base is a convention guess, not seen in an export
  rootPath: (LINKS.root_path || null),          // THIS PDA's folder (server-relative)
  masterRoot: (LINKS.master_root_path || null), // parent folder of a library-wide query
  pdaFolder: (LINKS.pda_folder || ""),          // this PDA's folder name under that parent
  appOpen: null,           // expanded applicant comments in the Chart A pane (by name)
  selApp: null,            // ACTIVE applicant (name) — scopes the rail category chart

const ALLCATS=["A","B","C","D","E","F","G"];
// the category slice: selected-category dollars for a county row
function catValue(r){
  if(!r||!r.cats) return null;
  let t=0; ALLCATS.forEach(c=>{ if(S.catSel.has(c)) t+=r.cats[c]||0; });
  return Math.round(t*100)/100;
}
const catNarrowed=()=>S.catSel.size<ALLCATS.length;

// human label for the current slice (null = not narrowed): "A–B", "C–G", "CDE"
function sliceLab(){
  if(!catNarrowed()) return null;
  const sel=ALLCATS.filter(c=>S.catSel.has(c)).join("");
  return sel==="AB" ? "A–B" : sel==="CDEFG" ? "C–G" : sel;
}

const APPIX={};
DATA.applicants.forEach(a=>{ (APPIX[a.county]=APPIX[a.county]||[]).push(a); });

try{

/* ---- SharePoint link plumbing ----

   into a URL. Baked `url` stays the fallback for boards built before this. */
const encPath = p => String(p||"").split("/").filter(Boolean).map(encodeURIComponent).join("/");
const trimSlash = u => String(u||"").trim().replace(/\/+$/,"");
function fileUrl(f){
  const b=trimSlash(S.spBase);
  if(b && f && f.path) return b+"/"+encPath(f.path);

const pdaTokens = t => new Set(String(t||"").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean));

// query.iqy, parsed in the browser — same fields as sp_filetree.parse_iqy
function parseIqy(text){
  let url=null; const kv={};
  String(text||"").split(/\r?\n/).forEach(raw=>{
    const ln=raw.trim(); if(!ln) return;
    if(url===null && /^https?:/i.test(ln)){ url=ln; return; }
    const i=ln.indexOf("=");
    if(i>0) kv[ln.slice(0,i).trim().toLowerCase()]=ln.slice(i+1).trim();
  });
  let root=kv["rootfolder"]||"";
  if(!root && url){ const m=/[?&]RootFolder=([^&]*)/i.exec(url); if(m) root=m[1]; }
  const app=kv["sharepointapplication"]||url||"";
  let host="";
  try{ const u=new URL(app); host=u.protocol+"//"+u.host; }catch(e){}
  let rootPath="";
  try{ rootPath=decodeURIComponent(root).trim().replace(/\/+$/,""); }catch(e){ rootPath=root; }
  if(rootPath && rootPath[0]!=="/") rootPath="/"+rootPath;
  return {host, rootPath, rootName: rootPath?rootPath.split("/").pop():""};
}

/* ---------------- formatting ---------------- */
const fmt$ = v => v==null ? "—" : "$"+Math.round(v).toLocaleString("en-US");
const fmt$c = v => {
  if (v==null) return "—";
  const a=Math.abs(v);
  if (a>=1e6) return "$"+(v/1e6).toFixed(2)+"M";
  if (a>=1e4) return "$"+(v/1e3).toFixed(0)+"k";
  return "$"+v.toLocaleString("en-US",{maximumFractionDigits:0});
};
const fmtPct = v => v==null ? "—" : v.toFixed(v>=100?0:1)+"%";
const fmtTs = t => {
  if (!t) return "—";
  const d=new Date(t.replace(" ","T"));
  return isNaN(d) ? t : d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
};
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* incident period, from the Table A meta (pipeline `incident`) — falls back to
   the single synthesized event label on boards built before that field */
const fmtD = t => { if(!t) return null;
  const s=String(t);
  // bare dates parse as LOCAL midnight — new Date("2026-04-10") is UTC and
  // renders Apr 9 in every US timezone
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s.replace(" ","T"));
  return isNaN(d)?s:d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"}); };
function fmtPeriod(a,b){
  if(!a) return null;
  const A=fmtD(a); if(!b||b===a) return A;
  const ya=String(a).slice(0,4), yb=String(b).slice(0,4);
  return (ya===yb?A.replace(", "+ya,""):A)+" – "+fmtD(b);

DATA.counties.forEach(r => { (byCounty[r.county] = byCounty[r.county]||{})[r.event_id] = r; });
// MIXED board: met AND did-not-meet counties both VISIBLE (fidelity /
// met_only:false). Drives the firmer red palette (:root[data-mixed]), the
// green/red row tints, MET/NOT MET tier badges, and the exec summary card.
const MIXED=(()=>{
  if(!COMPLETE) return false;
  const per={};
  DATA.counties.forEach(r=>{ const a=per[r.county]=per[r.county]||{t:0,th:r.county_threshold};
    a.t+=r.validated_total||0; a.th=a.th||r.county_threshold; });
  const vs=Object.values(per).filter(a=>a.th);
  return vs.some(a=>a.t>=a.th) && vs.some(a=>a.t<a.th);
})();

function rowFor(county, ev){            // ev may be "ALL" -> synthesized combined row
  const evs = byCounty[county]; if (!evs) return null;
  if (ev !== "ALL") return evs[ev] || null;
  const rows = Object.values(evs);
  const anyTotal = rows.some(r => r.validated_total != null);
  const total = anyTotal ? rows.reduce((a,r)=>a+(r.validated_total||0),0) : null;
  const thresh = rows[0].county_threshold;
  const cats = rows.some(r=>r.cats) ? "ABCDEFG".split("").reduce((o,c)=>{
      o[c]=rows.reduce((a,r)=>a+((r.cats||{})[c]||0),0); return o;},{}) : null;
  const napp = rows.some(r=>r.applicants_n!=null) ? rows.reduce((a,r)=>a+(r.applicants_n||0),0) : null;
  return {
    // single-incident PDAs (every completed import) never say "Combined" —
    // the one event's own label (the incident period) is the truth
    county, fips: rows[0].fips, event_id:"ALL",
    event_label: DATA.events.length===1 ? (PERIOD||DATA.events[0].label) : "Combined",
    stage: Math.max(...rows.map(r=>r.stage)),
    stage_label: STAGE_LABELS[Math.max(...rows.map(r=>r.stage))],
    ingested: rows.some(r=>r.ingested),
    population: rows[0].population, county_threshold: thresh,
    validated_total: total,
    pct_of_target: (total!=null && thresh) ? +(100*total/thresh).toFixed(1) : null,
    money_tier: total==null ? "unknown" : (thresh && total/thresh>=1 ? "met_100" : (thresh && total/thresh>=.5 ? "met_50" : (total>0?"under":"zero"))),
    emergency: rows.some(r=>r.emergency!=null)?rows.reduce((a,r)=>a+(r.emergency||0),0):null,
    permanent: rows.some(r=>r.permanent!=null)?rows.reduce((a,r)=>a+(r.permanent||0),0):null,
    cats, applicants_n:napp,
    applicants_complete: rows.some(r=>r.applicants_complete!=null)?rows.reduce((a,r)=>a+(r.applicants_complete||0),0):null,
    inspector: rows.map(r=>r.inspector).filter(Boolean)[0]||null,
    last_touch: rows.map(r=>r.last_touch).filter(Boolean).sort().pop()||null,
    last_touch_by: rows.map(r=>r.last_touch_by).filter(Boolean)[0]||null,
    sp_url: rows.map(r=>r.sp_url).filter(Boolean)[0]||null,
    // pointers to the source Chart A workbook (exact path from the export, or
    // the drop-relative one) — the "Chart A workbook" link in the county pane
    source_path: rows.map(r=>r.source_path).filter(Boolean)[0]||null,
    source_rel: rows.map(r=>r.source_rel).filter(Boolean)[0]||null,
    source_file: rows.map(r=>r.source_file).filter(Boolean)[0]||null,
    flags: rows.flatMap(r=>r.flags||[]),
  };
}
const allRows = ev => Object.keys(byCounty).map(c => rowFor(c, ev)).filter(Boolean);

function recomputeCountyBase(){
  const base=trimSlash(S.spBase);
  if(!base||!S.rootPath) { S.masterFolder=""; S.mfAssumed=null; return; }
  const known = LINKS.counties_path && LINKS.root_path &&
                S.rootPath.toLowerCase()===LINKS.root_path.toLowerCase();
  const sub = known ? LINKS.counties_path
                    : S.rootPath+"/"+(LINKS.county_subpath||"Damage Data/Counties");
  S.masterFolder = base+"/"+encPath(sub);
  S.mfAssumed = !known;
}

/* ---- CSV export (Power BI): flat tables built straight from board_data —
   plain numbers, ISO dates, quoted text, UTF-8 BOM. Exports are the full
   DATA (never the current view filters). */
function csvEsc(v){
  if(v==null) return "";
  const s=String(v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvOf(rows,cols){
  return "﻿"+[cols.join(","),   // BOM so Excel/Power BI read UTF-8
    ...rows.map(r=>cols.map(c=>csvEsc(r[c])).join(","))].join("\r\n");
}
function pbiCsv(kind){
  const evLab={}; DATA.events.forEach(e=>evLab[e.event_id]=e.label);
  const catCols=ALLCATS.map(c=>"cat_"+c.toLowerCase());
  if(kind==="counties"){
    const cols=["pda_id","county","fips","event_id","event_label","status",
      "population","county_indicator","validated_total","pct_of_indicator",
      "met_indicator","emergency_ab","permanent_cg",...catCols,
      "applicants","inspector","excluded_met_only"];
    const rows=DATA.counties.map(r=>{
      const o={pda_id:DATA.pda.id,county:r.county,fips:r.fips,
        event_id:r.event_id,event_label:evLab[r.event_id]||r.event_id,
        status:r.stage_label,population:r.population,
        county_indicator:r.county_threshold,validated_total:r.validated_total,
        pct_of_indicator:r.pct_of_target,
        met_indicator:(r.county_threshold&&r.pct_of_target!=null)
          ?(r.pct_of_target>=100?"TRUE":"FALSE"):"",
        emergency_ab:r.emergency,permanent_cg:r.permanent,
        applicants:r.applicants_n,inspector:r.inspector,
        excluded_met_only:"FALSE"};
      ALLCATS.forEach(c=>o["cat_"+c.toLowerCase()]=(r.cats||{})[c]);
      return o;
    });
    (((DATA.met_only_excluded||{}).counties)||[]).forEach(x=>rows.push({
      pda_id:DATA.pda.id,county:x.county,fips:x.fips,event_id:"",event_label:"",
      status:"Excluded (under county indicator)",population:"",
      county_indicator:x.threshold,validated_total:x.total,
      pct_of_indicator:x.pct,met_indicator:"FALSE",
      emergency_ab:"",permanent_cg:"",applicants:"",inspector:"",
      excluded_met_only:"TRUE"}));
    return {name:`${DATA.pda.id}_counties.csv`,text:csvOf(rows,cols)};
  }
  if(kind==="applicants"){
    const cols=["pda_id","county","event_id","event_label","applicant",
      "status","validated_total",...catCols,"comment"];
    const rows=DATA.applicants.map(a=>{
      const o={pda_id:DATA.pda.id,county:a.county,event_id:a.event_id,
        event_label:evLab[a.event_id]||a.event_id,applicant:a.applicant,
        status:a.status_raw,validated_total:a.total_calc,comment:a.comment};
      ALLCATS.forEach(c=>o["cat_"+c.toLowerCase()]=a["cat_"+c.toLowerCase()]);
      return o;
    });
    return {name:`${DATA.pda.id}_applicants.csv`,text:csvOf(rows,cols)};
  }
  const s=DATA.summaries.ALL||{}, g=s.guide_math||{}, ind=DATA.indicators||{},
        ex=DATA.met_only_excluded||{};
  const row={pda_id:DATA.pda.id,title:DATA.pda.title,state:DATA.pda.state,
    incident_start:(DATA.incident||{}).start,incident_end:(DATA.incident||{}).end,
    statewide_indicator:s.state_threshold,state_pci:ind.state_pci,
    county_pci:ind.county_pci,state_population:ind.state_population,
    validated_total:s.validated_total,countable_toward_indicator:g.countable,
    pct_of_statewide:s.pct_of_state,counties:s.counties_total,
    applicant_rows:s.applicants_n,met_only:DATA.met_only?"TRUE":"FALSE",
    excluded_counties:ex.n||0,excluded_total:ex.total||0,
    complete:COMPLETE?"TRUE":"FALSE",generated:DATA.generated};
  return {name:`${DATA.pda.id}_summary.csv`,text:csvOf([row],Object.keys(row))};
}
function dlCsv(kind){

/* meter geometry, shared by the statewide thermometer and the per-county meter.
   100% is a bold marker near the END of the track (METER_GOAL), so at 100% the
   MAIN bar is essentially full; going over then fills a distinct OVERFLOW segment
   that extends PAST the 100% line into the remaining track, on a saturating curve
   so 120% shows a clear chunk over and 6808% just maxes the overflow lane (never
   running off the bar). Returns track positions as % of the track width. */
const METER_GOAL = 82;          // the 100% line — main bar is ~full here
const METER_OVER_K = 45;        // over-% that fills ~half the overflow lane
// fill-up animation: the statewide bar animates once on page load, each county
// meter animates when its county is opened (not on every re-render)
let RAIL_ANIM = true, CTY_ANIM = false, CAT_ANIM = false;
function meterGeom(pct){
  pct = Math.max(0, pct || 0);
  const goal = METER_GOAL;
  const baseW = Math.min(100, pct) / 100 * goal;            // main bar, 0..goal
  const over = Math.max(0, pct - 100);
  const overW = over > 0 ? (100 - goal) * (over / (over + METER_OVER_K)) : 0;  // past 100%
  const r2 = x => Math.round(x * 100) / 100;
  return {goal, baseW: r2(baseW), overW: r2(overW), fill: r2(baseW + overW), over: pct > 100};
}

/* COMPLETE rail: (1) Thresholds — a VERTICAL bar with the 100% goal line and a
   distinct overflow segment (NO 75% marker on a finished board), tiny
   top-level stats to its right ("26 Counties · 11 under threshold"), and the

   (2) Table A — incident period + compact tier rows (no pills, nothing shown
   twice) + the category-of-work histogram, which scopes to the selected county
   and is labeled as such. (3) The Counties card below is the moved-in scope
   band + county table (renderRight). */
function renderRailComplete(){
  const s=summary(), g=s.guide_math||{}, T=s.state_threshold||0;
  const selR=S.selected?rowFor(S.selected.key,S.event):null;
  const rows=allRows(S.event);
  // category chart scope: state -> county (click a county) -> applicant
  // (click an applicant row). Multiple applicants can be OPEN (comments);
  // the chart shows county numbers until one is made ACTIVE by clicking.
  const selAppRows = selR&&S.selApp
    ? DATA.applicants.filter(a=>a.county===selR.county&&a.applicant===S.selApp
                               &&(S.event==="ALL"||a.event_id===S.event))
    : [];
  const scope = selAppRows.length?"app":selR?"cty":"state";
  // metric follows the $ Validated / Applicants toggle: dollars per category,
  // or the number of applicants WITH dollars in that category (an applicant
  // scope is always dollars — a per-category count of one applicant is noise)
  const chartMetric = (S.mapMetric==="apps" && scope!=="app") ? "apps" : "dollars";
  const evOK = a => S.event==="ALL"||a.event_id===S.event;
  // statewide scope honors the ACTIVE FILTERS (tier rows ≥100/50–99/<50,
  // stage, category slice) — clicking a tier re-scopes the chart's numbers
  const baseRows = rows.filter(rowPass);
  const passCty = new Set(baseRows.map(r=>r.county));
  const appPool = chartMetric==="apps"
    ? DATA.applicants.filter(a=>evOK(a)&&(scope==="cty"?a.county===selR.county:passCty.has(a.county)))
    : null;
  const agg={}; let aggMax=1, aggTot=0;
  "ABCDEFG".split("").forEach(c=>{
    const lc="cat_"+c.toLowerCase();
    agg[c]=chartMetric==="apps"?appPool.filter(a=>(a[lc]||0)>0).length
      :scope==="app"?selAppRows.reduce((a,x)=>a+(x[lc]||0),0)
      :selR?((selR.cats||{})[c]||0):baseRows.reduce((a,r)=>a+((r.cats||{})[c]||0),0);
    if(agg[c]>aggMax)aggMax=agg[c];
    aggTot+=agg[c];});
  const vfmt = chartMetric==="apps" ? (v=>String(v)) : fmt$c;
  // color scheme shifts with the scope so the change reads instantly (muted
  // tones — teal statewide, slate blue county, antique gold applicant)
  const barCol = scope==="app"?"#c8a04d":scope==="cty"?"#4f7fae":"#40796a";
  // the card's TITLE line says which level is charted
  const scopeTitle = scope==="app"?`${S.selApp} · ${selR.county}`
    :scope==="cty"?`${selR.county} County`:DATA.pda.title;
  const cgc = CAT_ANIM?" cgrow":""; CAT_ANIM=false;
  const taU=tableAUrl();
  const excl=(DATA.met_only&&(DATA.met_only_excluded||{}).n)?DATA.met_only_excluded:null;
  const vbar=(pct,titleTxt,gc,gc2)=>{
    // LINEAR: the track spans max(validated, indicator). At/under 100% the
    // 100% line sits at the top; over it, the line moves DOWN in proportion
    // (300% -> a third of the way up) — navy below the line, gold above.
    const p=Math.max(0,pct||0);
    const goalY=p>100?10000/p:100;
    const fillH=p>100?100:p;
    const baseH=Math.min(fillH,goalY);
    const overH=Math.max(0,fillH-goalY);
    const lab=pct==null?"—":(p>=10?Math.round(p)+"%":(Math.round(p*10)/10)+"%");
    return `<div class="vbar" title="${esc(titleTxt)}">
      <i class="vfill${gc}" style="height:${baseH.toFixed(2)}%"></i>
      ${overH?`<i class="vover${gc2}" style="bottom:${goalY.toFixed(2)}%;height:${overH.toFixed(2)}%"></i>`:""}

  const taLink=`<a class="chartalink sm ${taU?"":"inert"}" ${taU
    ?`href="${esc(taU)}" target="_blank" rel="noopener" title="Open the Table A workbook in SharePoint"`
    :`href="#" onclick="return false" title="Link not live yet — open Admin (gear) and set the SharePoint site base; the path is already built"`}>Table A ↗</a>`;
  let thrCard;
  if(!selR){
    const pctRaw=T&&g.countable!=null?100*g.countable/T:0;

    const perC={};
    rows.forEach(r=>{ const a=perC[r.county]=perC[r.county]||{t:0,th:r.county_threshold};

          <div class="vstat big2 okst"><b class="num">${metArr.length}</b> met · <span class="num">${fmt$c(metArr.reduce((x,a)=>x+a.t,0))}</span></div>

          <div class="vstat big2"><b class="num">${s.counties_total}</b> Counties</div>
          <div class="vstat big2"><b class="num">${s.applicants_n??"—"}</b> applicants</div>
          <div class="vstat big2 lead"><b class="num">${fmt$(g.countable)}</b> validated</div>
          ${underN?`<div class="vstat warn" title="${excl?`Excluded from every figure on this board (met_only)`:`Below the county indicator — not countable toward the statewide indicator`}"><b class="num">${underN}</b> did not meet · <span class="num">${fmt$c(under$)}</span></div>`:""}

    thrCard=`

        </div>

    </div>`;
  } else {
    const p=selR.pct_of_target, thr=selR.county_threshold;
    const mgc=CTY_ANIM?" grow":"", mgc2=CTY_ANIM?" grow2":""; CTY_ANIM=false;
    thrCard=`
    <div class="card morph" id="thrCard">
      <h3>${esc(selR.county)} County</h3>
      ${selR.inspector?`<div class="kpi-sub">Inspector <b>${esc(selR.inspector)}</b></div>`:""}
      <div class="vwrap">
        ${vbar(p,`Validated vs the county indicator ${fmt$(thr)}`,mgc,mgc2)}
        <div class="vstats">
          <div class="vstat lead"><b class="num">${selR.ingested?fmt$(selR.validated_total):"—"}</b> validated</div>
          <div class="vstat"><b class="num">${fmt$(thr)}</b> county indicator</div>
          <div class="vstat"><b class="num">${p!=null?fmtPct(p):"—"}</b> of indicator</div>
          <div class="vstat"><b class="num">${selR.applicants_n??"—"}</b> applicant${selR.applicants_n===1?"":"s"}</div>
        </div>
      </div>
      ${selR.emergency!=null?`
      <div class="split">
        <i class="${mgc2}" style="flex:${selR.emergency||0.001};background:var(--m2)" title="Emergency work ${fmt$(selR.emergency)}"></i>
        <i class="${mgc2}" style="flex:${selR.permanent||0.001};background:var(--accent-dim)" title="Permanent work ${fmt$(selR.permanent)}"></i>
      </div>
      <div class="split-legend">
        <span><span class="sw" style="background:var(--m2)"></span>Emergency (A–B) <b class="num">${fmt$c(selR.emergency)}</b></span>
        <span><span class="sw" style="background:var(--accent-dim)"></span>Permanent (C–G) <b class="num">${fmt$c(selR.permanent)}</b></span>
      </div>`:""}
    </div>`;
  }
  const solo=S.pctSel.size===1;
  // tier value follows the $ Validated / Applicants toggle: dollars, or the
  // applicant count across that tier's counties (slice-aware)
  const tierApps=pred=>rows.filter(r=>r.county_threshold&&r.pct_of_target!=null&&pred(r.pct_of_target))
    .reduce((t,r)=>t+(appsValue(r)||0),0);
  const TIER_PRED={met:p=>p>=100, half:p=>p>=50&&p<100, under:p=>p<50};

  const GDEFS=groupDefs();
  const G=GDEFS.map(gd=>({...gd,
    v: chartMetric==="apps"
      ? appPool.filter(a=>gd.cats.some(c=>(a["cat_"+c.toLowerCase()]||0)>0)).length

  const gMax=Math.max(1,...G.map(x=>x.v)), gTot=G.reduce((t,x)=>t+x.v,0);

  const VIZ_NAMES=["Bar chart","Pie","Stacked bar","Rows"];
  let viz;

  } else if(S.catViz===1){                                  // pie
    const R=64,CX=78,CY=74;
    const arc=(a0,a1)=>{
      const p=a=>[CX+R*Math.cos(a),CY+R*Math.sin(a)];

      `<span><i style="background:${gcol(x)}"></i>${x.short} ${vfmt(x.v)}</span>`).join("")}</div>`;
  } else if(S.catViz===3){                                  // per-group rows
    viz=`<div class="cathrows">${G.map(x=>{
      const v=x.v, col=gcol(x);
      return `<div class="cathrow ${unselG(x)?"unsel":""}" data-cat="${x.key}" title="${esc(gtitle(x))}">
        <span class="crl" style="background:${v?col:"var(--line2)"};color:${contrastText(v?col:"#dddddd")}">${x.short}</span>
        <span class="crtrack"><i class="${cgc.trim()}" style="width:${v?Math.max(2,Math.round(100*v/gMax)):0}%;background:${col}"></i></span>
        <span class="crv num">${v?vfmt(v):"—"}</span></div>`;
    }).join("")}</div>`;
  } else {                                                  // default column bars
    viz=`<div class="catcols">${G.map(x=>{

      return `<div class="catcol ${v?"":"zero"} ${unselG(x)?"unsel":""}" data-cat="${x.key}" title="${esc(gtitle(x))}">
        <span class="cv num">${v?vfmt(v):""}</span><i class="${cgc.trim()}" style="height:${Math.max(2,Math.round(60*v/gMax))}px${v&&col?`;background:${col}`:""}"></i><span class="cl">${x.short}</span></div>`;
    }).join("")}</div>`;
  }
  const tableACard=`
  <div class="card">
    <h3>Categories of Work</h3>
    <div class="cwscope ${cgc?"morph":""}">${esc(scopeTitle)}</div>
    <div class="catmode">
      <button class="chip ${S.mapMetric==="dollars"?"selected":""}" data-mapmetric="dollars" title="Chart + map + row bars show validated dollars (honors the category slice)">$ Validated</button>
      <button class="chip ${S.mapMetric==="apps"?"selected":""}" data-mapmetric="apps" title="Chart + map + row bars show applicant counts (honors the category slice)">Applicants</button>
    </div>
    <div class="tamini">
      ${excl?"":tier("met","≥ 100%",g.full,g.n_full||0," · counts toward statewide")}
      ${g.n_half?tier("half","50 – 99%",g.half,g.n_half,g.gate75_ok?" · counted (75% rule met)":" · held"):""}
      ${g.n_below?tier("under","< 50%",g.below,g.n_below," · excluded"):""}
    </div>
    <div class="hah">${chartMetric==="apps"?"Applicants":"Dollars"} by <button class="catgroupbtn" data-catgroup title="Click to switch between Categories A–G and Type of work (Emergency A–B / Permanent C–G) — the charts and the A–G filters follow">${S.catGroup==="type"?"type":"category"}</button></div>
    <div class="catpeek">${viz}</div>
    <div class="vizrow">

  $("railTop").innerHTML=thrCard+tableACard;
