      </div>`:""}
    </div>`;
  }
  const solo=S.pctSel.size===1;
  // tier value follows the $ Validated / Applicants toggle: dollars, or the
  // applicant count across that tier's counties (slice-aware)
  const tierApps=pred=>rows.filter(r=>r.county_threshold&&r.pct_of_target!=null&&pred(r.pct_of_target))
    .reduce((t,r)=>t+(appsValue(r)||0),0);
  const TIER_PRED={met:p=>p>=100, half:p=>p>=50&&p<100, under:p=>p<50};
  const tier=(id,lab,dollars,n,note)=>{
    const val=S.mapMetric==="apps"
      ? `${tierApps(TIER_PRED[id])} applicants` : fmt$(dollars);
    const pill=id==="met"?`<span class="pill ok">MET</span>`:`<span class="pill no">NOT MET</span>`;
    return `
    <button class="tam tcrow t-${id} ${DATA.met_only&&id==="met"?"blue":""} ${solo&&S.pctSel.has(id)?"on":""}" data-tier="${id}" title="Click to filter the county list + map + chart to this tier.">
      <span class="tl">${lab}</span>${pill}<b class="num">${val}</b>
      <span class="tc num">${n} ${n===1?"County":"Counties"}${note||""}</span>
    </button>`;
  };
  // ---- Categories of Work: four flippable visualizations, all with the
  // same hover-peek + click-slice wiring (delegated on [data-cat])
  // GROUPED rendering: A–G, or Emergency/Permanent under the type toggle.
  // For the applicants metric a group counts DISTINCT applicants with $ in
  // any of its categories (a summed count would double-count A+B applicants).
  const GDEFS=groupDefs();
  const G=GDEFS.map(gd=>({...gd,
    v: chartMetric==="apps"
      ? appPool.filter(a=>gd.cats.some(c=>(a["cat_"+c.toLowerCase()]||0)>0)).length
      : Math.round(gd.cats.reduce((t,c)=>t+(agg[c]||0),0)*100)/100}));
  const gMax=Math.max(1,...G.map(x=>x.v)), gTot=G.reduce((t,x)=>t+x.v,0);
  const gcol=x=>x.color||CAT_COLORS[x.cats[0]];
  const unselG=x=>catNarrowed()&&!x.cats.every(c=>S.catSel.has(c));
  // tooltip = just that group's facts, nothing else
  const gtitle=x=>`${x.label}: ${vfmt(x.v)}${chartMetric==="apps"?" applicants":""}`;
  const VIZ_NAMES=["Bar chart","Pie","Stacked bar","Rows"];
  let viz;
  if(gTot<=0){
    viz=`<div class="linknote" style="margin-top:12px">Nothing in the current slice.</div>`;
  } else if(S.catViz===1){                                  // pie
    const R=64,CX=78,CY=74;
    const arc=(a0,a1)=>{
      const p=a=>[CX+R*Math.cos(a),CY+R*Math.sin(a)];
      const [x0,y0]=p(a0),[x1,y1]=p(a1);
      return `M${CX},${CY}L${x0.toFixed(1)},${y0.toFixed(1)}A${R},${R} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1.toFixed(1)},${y1.toFixed(1)}Z`;
    };
    let a=-Math.PI/2, parts="";
    G.forEach(x=>{
      const v=x.v; if(!v) return;
      const f=v/gTot, col=gcol(x);
      if(f>=0.999){ parts+=`<circle class="wedge ${unselG(x)?"unselw":""}" data-cat="${x.key}" cx="${CX}" cy="${CY}" r="${R}" fill="${col}"><title>${esc(gtitle(x))}</title></circle>`; }
      else{
        const a1=a+f*2*Math.PI;
        parts+=`<path class="${unselG(x)?"unselw":""}" data-cat="${x.key}" d="${arc(a,a1)}" fill="${col}"><title>${esc(gtitle(x))}</title></path>`;
        if(f>=0.055){
          const m=(a+a1)/2, lx=CX+R*0.62*Math.cos(m), ly=CY+R*0.62*Math.sin(m);
          parts+=`<text class="pielab" x="${lx.toFixed(1)}" y="${(ly+3.5).toFixed(1)}" text-anchor="middle" fill="${contrastText(col)}">${x.short}</text>`;
        }
        a=a1;
      }
    });
    viz=`<div class="catpie ${cgc?"morph":""}"><svg width="156" height="148" viewBox="0 0 156 148" role="img" aria-label="Categories of work — pie">${parts}</svg></div>`;
  } else if(S.catViz===2){                                  // stacked horizontal
    viz=`<div class="catstack catpeek2 ${cgc.trim()}">${G.map(x=>{
      const v=x.v; if(!v) return "";
      const w=100*v/gTot, col=gcol(x);
      return `<i class="${unselG(x)?"unsel":""}" data-cat="${x.key}" style="flex:${v};background:${col};color:${contrastText(col)}" title="${esc(gtitle(x))}">${w>=7?x.short:""}</i>`;
    }).join("")}</div>
    <div class="htkey" style="margin-top:8px">${G.filter(x=>x.v).map(x=>
      `<span><i style="background:${gcol(x)}"></i>${x.short} ${vfmt(x.v)}</span>`).join("")}</div>`;
  } else if(S.catViz===3){                                  // per-group rows
    viz=`<div class="cathrows">${G.map(x=>{
      const v=x.v, col=gcol(x);
      return `<div class="cathrow ${unselG(x)?"unsel":""}" data-cat="${x.key}" title="${esc(gtitle(x))}">
        <span class="crl" style="background:${v?col:"var(--line2)"};color:${contrastText(v?col:"#dddddd")}">${x.short}</span>
        <span class="crtrack"><i class="${cgc.trim()}" style="width:${v?Math.max(2,Math.round(100*v/gMax)):0}%;background:${col}"></i></span>
        <span class="crv num">${v?vfmt(v):"—"}</span></div>`;
    }).join("")}</div>`;
  } else {                                                  // default column bars
    viz=`<div class="catcols">${G.map(x=>{
      const v=x.v;
      const col=S.catGroup==="type"?gcol(x):barCol;
      return `<div class="catcol ${v?"":"zero"} ${unselG(x)?"unsel":""}" data-cat="${x.key}" title="${esc(gtitle(x))}">
        <span class="cv num">${v?vfmt(v):""}</span><i class="${cgc.trim()}" style="height:${Math.max(2,Math.round(60*v/gMax))}px${v&&col?`;background:${col}`:""}"></i><span class="cl">${x.short}</span></div>`;
    }).join("")}</div>`;
  }
  const tableACard=`
  <div class="card">
    <h3>Categories of Work</h3>
    <div class="cwscope ${cgc?"morph":""}">${esc(scopeTitle)}</div>
    <div class="catmode">
      <button class="chip ${S.mapMetric==="dollars"?"selected":""}" data-mapmetric="dollars" title="Chart + map + row bars show validated dollars (honors the category slice)">$ Validated</button>
      <button class="chip ${S.mapMetric==="apps"?"selected":""}" data-mapmetric="apps" title="Chart + map + row bars show applicant counts (honors the category slice)">Applicants</button>
    </div>
    <div class="tamini">
      ${excl?"":tier("met","≥ 100%",g.full,g.n_full||0," · counts toward statewide")}
      ${g.n_half?tier("half","50 – 99%",g.half,g.n_half,g.gate75_ok?" · counted (75% rule met)":" · held"):""}
      ${g.n_below?tier("under","< 50%",g.below,g.n_below," · excluded"):""}
    </div>
    <div class="hah">${chartMetric==="apps"?"Applicants":"Dollars"} by <button class="catgroupbtn" data-catgroup title="Click to switch between Categories A–G and Type of work (Emergency A–B / Permanent C–G) — the charts and the A–G filters follow">${S.catGroup==="type"?"type":"category"}</button></div>
    <div class="catpeek">${viz}</div>
    <div class="vizrow">
      <span></span>
      <div class="viznav">
        <button data-viznav="-1" title="Previous chart type" aria-label="Previous chart type">‹</button>
        <span class="vizname">${VIZ_NAMES[S.catViz]}</span>
        <button data-viznav="1" title="Next chart type" aria-label="Next chart type">›</button>
      </div>
    </div>
  </div>`;
  $("railTop").innerHTML=thrCard+tableACard;
}

$("rail").addEventListener("click",e=>{
  const mm=e.target.closest("[data-mapmetric]");
  if(mm){
    // $ Validated / Applicants toggle: drives the category chart, the map
    // choropleth + values, and the translucent county-row bars
    const m=mm.dataset.mapmetric;
    S.mapMetric = S.mapMetric===m ? null : m;
    CAT_ANIM=true;
    renderRail(); paintMap(); renderRight(); return;
  }
  const vn=e.target.closest("[data-viznav]");
  if(vn){
    S.catViz=(S.catViz+ +vn.dataset.viznav+4)%4;

    renderRail(); return;
  }
  const gb=e.target.closest("[data-catgroup]");
  if(gb){
    // the word in "Dollars by category|type" IS the toggle: A–G <-> Emergency
    // (A–B) / Permanent (C–G) — charts + filters follow
    S.catGroup=S.catGroup==="type"?"cat":"type";

  const cc=e.target.closest(".catpeek [data-cat]");
  if(cc){
    // click = the SLICE: county list + $ column + map metrics — and the open
    // county's APPLICANT list — show only this group's dollars; click again

    const cats=cc.dataset.cat.split(",");
    const solo=S.catSel.size===cats.length&&cats.every(c=>S.catSel.has(c));
    S.catSel=solo?new Set(ALLCATS):new Set(cats);
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  const b=e.target.closest("[data-tier]"); if(!b) return;

  if(S.pctSel.size===1&&S.pctSel.has(v)){ ["met","half","under","review","none"].forEach(x=>S.pctSel.add(x)); }
  else { S.pctSel=new Set([v]); }
  if(S.selected){ S.selected=null; S.selApp=null; setView("table"); if(COMPLETE) mapZoom(null); renderChartPane(); }
  paintMap(); renderRight(); renderRail();
});

/* ---------------- map ---------------- */
const MAP = {W:640,H:760,paths:{},proj:null};
(function buildMap(){
  const feats = DATA.geo.features;
  const rowsByFips={}; DATA.counties.forEach(r=>{ if(r.fips) rowsByFips[r.fips]=r.county; });
  // Fit the camera to the SCOPE counties (plus margin), not the whole state —
  // a PDA clustered in one region fills the card instead of floating in it.
  const scopeFeats = feats.filter(f=>rowsByFips[f.id]);
  const fitFeats = scopeFeats.length ? scopeFeats : feats;
  let minLon=1e9,maxLon=-1e9,minLat=1e9,maxLat=-1e9;
  const each = (g,fn)=> (g.type==="Polygon"?g.coordinates:g.coordinates.flat(1)).forEach(ring=>ring.forEach(fn));
  fitFeats.forEach(f=>each(f.geometry,p=>{minLon=Math.min(minLon,p[0]);maxLon=Math.max(maxLon,p[0]);
                                          minLat=Math.min(minLat,p[1]);maxLat=Math.max(maxLat,p[1]);}));
  const mLon=(maxLon-minLon)*0.04, mLat=(maxLat-minLat)*0.04;   // 4% breathing room
  minLon-=mLon; maxLon+=mLon; minLat-=mLat; maxLat+=mLat;
  const kx=Math.cos((minLat+maxLat)/2*Math.PI/180);
  const sw=(maxLon-minLon)*kx, sh=maxLat-minLat, pad=8;
  const s=Math.min((MAP.W-2*pad)/sw,(MAP.H-2*pad)/sh);
  const ox=(MAP.W-sw*s)/2, oy=(MAP.H-sh*s)/2;
  MAP.proj=p=>[ox+(p[0]-minLon)*kx*s, oy+(maxLat-p[1])*s];
  MAP.center={}; MAP.bbox={};
  feats.forEach(f=>{
    const polys=f.geometry.type==="Polygon"?[f.geometry.coordinates]:f.geometry.coordinates;
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    MAP.paths[f.id]=polys.map(rings=>rings.map(ring=>
      "M"+ring.map(p=>{const q=MAP.proj(p);
        if(q[0]<mnx)mnx=q[0]; if(q[0]>mxx)mxx=q[0]; if(q[1]<mny)mny=q[1]; if(q[1]>mxy)mxy=q[1];
        return q.map(v=>v.toFixed(1)).join(",");}).join("L")+"Z").join("")).join("");
    MAP.center[f.id]=[(mnx+mxx)/2,(mny+mxy)/2];
    MAP.bbox[f.id]={w:mxx-mnx,h:mxy-mny};
  });
  // met_only-EXCLUDED counties render as plain nonscope — the owner chose
  // "don't include" and that means the map too (2026-07-28; the red-shading
  // treatment belongs to boards that INCLUDE their non-met counties as rows)
  $("map").innerHTML=`<svg viewBox="0 0 ${MAP.W} ${MAP.H}" preserveAspectRatio="xMidYMid meet"><g class="zoomg"><g class="gp">`+
    feats.map(f=>{
      const cty=rowsByFips[f.id];
      return `<path id="p${f.id}" class="cty ${cty?"":"nonscope"}" d="${MAP.paths[f.id]}"
        ${cty?`data-cty="${esc(cty)}" tabindex="0" role="button" aria-label="${esc(cty)} County"`:""}></path>`;
    }).join("")+`</g><g class="gl"></g><g class="gv"></g></g></svg>`;
  // Inline labels for every scope county, sized to the shape: shrink the font
  // to fit (never below 8px ON SCREEN), wrap two-word names onto two lines
  // when one line won't go. Truly tiny slivers stay unlabeled (tooltip).
  // ZOOM-AWARE: at camera scale `sc` a label is drawn at (screen-font / sc)
  // svg units so names stay readable — and counties too small to label at 1×
  // GAIN labels once zoomed in. Re-rendered on every zoom change.
  MAP.renderLabels=function(sc){
    sc=sc||1;
    const gl=$("map").querySelector("g.gl"); if(!gl) return;
    const CH=0.62;                              // approx px per char per font px
    const halo=(2.6/sc).toFixed(2);
    gl.innerHTML=feats.map(f=>{
      const cty=rowsByFips[f.id]; if(!cty) return "";
      const bb=MAP.bbox[f.id], c=MAP.center[f.id];
      const AVAIL=bb.w*0.92;
      let fs=Math.min(12.5, AVAIL*sc/(CH*cty.length));   // screen px
      if(fs>=8 && bb.h*sc>=fs+5){
        const f1=fs/sc;
        return `<text class="ctylab" id="l${f.id}" x="${c[0].toFixed(1)}" y="${(c[1]+f1*0.35).toFixed(1)}" style="font-size:${f1.toFixed(2)}px;stroke-width:${halo}px">${esc(cty)}</text>`;
      }
      if(cty.includes(" ")){
        const words=cty.split(" ");
        let best=null;
        for(let i=1;i<words.length;i++){
          const l1=words.slice(0,i).join(" "), l2=words.slice(i).join(" ");
          const m=Math.max(l1.length,l2.length);
          if(!best||m<best.m) best={l1,l2,m};
        }
        const f2s=Math.min(12, AVAIL*sc/(CH*best.m));
        if(f2s>=8 && bb.h*sc>=2.4*f2s){
          const f2=f2s/sc;
          return `<text class="ctylab" id="l${f.id}" style="font-size:${f2.toFixed(2)}px;stroke-width:${halo}px">`+
            `<tspan x="${c[0].toFixed(1)}" y="${(c[1]-f2*0.22).toFixed(1)}">${esc(best.l1)}</tspan>`+
            `<tspan x="${c[0].toFixed(1)}" y="${(c[1]+f2*0.92).toFixed(1)}">${esc(best.l2)}</tspan></text>`;
        }
      }
      return "";
    }).join("");
  };
  MAP.renderLabels(1);
  const svg=$("map").firstElementChild;
  svg.addEventListener("mousemove",e=>{
    const t=e.target.closest("[data-cty]");
    if(!t){hideTip();return;}
    showTip(t.dataset.cty,e.clientX,e.clientY);
  });
  svg.addEventListener("mouseleave",hideTip);
  svg.addEventListener("mouseover",e=>{
    const t=e.target.closest("[data-cty]");
    // Re-appending the hovered path (to raise its outline) re-inserts the node
    // under the cursor, which re-fires mouseover — an endless churn that eats
    // the subsequent click (mousedown/up pair on "different" nodes → the click
    // retargets to the <g> and the county never opens). Bail if already raised.
    if(t && t.classList.contains("hover")) return;
    svg.querySelectorAll(".hover").forEach(x=>x.classList.remove("hover"));
    if(t){
      t.classList.add("hover");
      t.parentNode.appendChild(t);   // raise so the bold outline isn't cut by neighbors
      showTip(t.dataset.cty,e.clientX,e.clientY);
    }
  });
  svg.addEventListener("click",e=>{
    let t=e.target.closest("[data-cty]");
    if(!t){                          // belt & suspenders: hit-test the point
      const el=document.elementFromPoint(e.clientX,e.clientY);
      t=el&&el.closest&&el.closest("[data-cty]");
    }
    if(t)openCounty(t.dataset.cty);
  });
  svg.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const t=e.target.closest("[data-cty]"); if(t){e.preventDefault();openCounty(t.dataset.cty);}}});
})();

/* COMPLETE: zoom the camera onto a county when it's opened (CSS-transitioned
   transform on the .zoomg wrapper; strokes stay screen-width via
   vector-effect, labels hide while zoomed). mapZoom(null) flies back out. */
function mapZoom(fips){
  const svg=$("map").firstElementChild; if(!svg) return;
  const zg=svg.querySelector(".zoomg"); if(!zg) return;
  if(!fips || !MAP.bbox[fips]){
    zg.style.transform=""; svg.classList.remove("zoomed");
    MAP.sc=1;
    MAP.renderLabels(1);
    return;
  }
  const b=MAP.bbox[fips], c=MAP.center[fips];
  // county fills ~55% of the shorter axis, capped so slivers don't over-zoom
  const sc=Math.max(1.15, Math.min(4.5,
    0.55*Math.min(MAP.W/Math.max(1,b.w), MAP.H/Math.max(1,b.h))));
  zg.style.transform=`translate(${(MAP.W/2-sc*c[0]).toFixed(1)}px,${(MAP.H/2-sc*c[1]).toFixed(1)}px) scale(${sc.toFixed(3)})`;
  svg.classList.add("zoomed");
  // labels re-drawn zoom-compensated; paintMap (called by every mapZoom
  // caller right after) re-applies the .on visibility classes
  MAP.sc=sc;
  MAP.renderLabels(sc);
}
function ctyFill(r){
  // FILL matches the Thresholds rows (which double as the map legend):
  // met / light red 50-99 / darker red <50 / YELLOW at lead review / grey
  // not submitted. Under met_only every county met — a wall of green says
  // nothing, so met switches to the scheme's blue.
  if (r.stage===2) return css("--fill-rev");
  const p = (r.stage>=3 && r.ingested) ? r.pct_of_target : null;
  if (p == null) return css("--fill-pre");
  if (p >= 100) return css(DATA.met_only ? "--fill-metblue" : "--fill-met");
  if (p >= 50)  return css("--fill-half");
  return css("--fill-under");
}
function catBlue(frac){
  // pale -> deep USWDS blue, sqrt-eased so small shares stay visible
  const t=Math.sqrt(Math.max(0,Math.min(1,frac)));
  const a=[214,230,245], b=[8,81,156];
  const c=a.map((x,i)=>Math.round(x+(b[i]-x)*t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function paintCatPeek(cat){
  // PEEK: fill = blue choropleth of this category-group's $ share by county;
  // the county's normal bucket color moves to its OUTLINE. `cat` may be a
  // comma list (type mode: "A,B").
  const cats=String(cat).split(",");
  const catsOf=r=>(showsMoney(r)&&r.cats)?cats.reduce((t,c)=>t+(r.cats[c]||0),0):0;
  const rows=allRows(S.event);
  const ix={}; rows.forEach(r=>{ if(r.fips) ix[r.fips]=r; });
  let mx=0; rows.forEach(r=>{ const v=catsOf(r); if(v>mx)mx=v; });
  DATA.geo.features.forEach(f=>{
    const el=document.getElementById("p"+f.id); if(!el) return;
    const r=ix[f.id]; if(!r) return;
    const v=catsOf(r);
    el.style.stroke=ctyFill(r);
    el.style.strokeWidth="2";
    el.style.fill = (mx>0&&v>0) ? catBlue(v/mx) : css("--surface3");
  });
}
function metricValue(r){
  if(S.mapMetric==="dollars") return showsMoney(r)?(catValue(r)||0):0;
  if(S.mapMetric==="apps") return appsValue(r)||0;
  return 0;
}
function paintMap(){
  const rows=allRows(S.event);
  const ix={}; rows.forEach(r=>{ if(r.fips) ix[r.fips]=r; });
  let mx=0;
  if(S.mapMetric) rows.forEach(r=>{ if(rowPass(r)){const v=metricValue(r); if(v>mx)mx=v;} });
  DATA.geo.features.forEach(f=>{
    const el=document.getElementById("p"+f.id); if(!el) return;
    const r=ix[f.id];
    el.classList.remove("selected","dimmed");
    el.style.stroke=""; el.style.strokeWidth="";
    const lab=document.getElementById("l"+f.id);
    if(!r){el.style.fill="";return;}
    const pass=rowPass(r);
    el.style.fill = S.mapMetric
      ? ((pass&&mx>0) ? catBlue(metricValue(r)/mx) : css("--surface3"))
      : ctyFill(r);
    // a VISIBLE county under its indicator keeps a red OUTLINE while the
    // metric choropleth owns the fill (its red fill already says so at rest)
    if(S.mapMetric && r.county_threshold && r.pct_of_target!=null && r.pct_of_target<100){
      el.style.stroke=css("--fill-under"); el.style.strokeWidth="2";
    }
    if(lab) lab.classList.toggle("on", r.stage>=3 && pass);
    if (!pass) el.classList.add("dimmed");
    if (S.selected && S.selected.type==="county" && S.selected.key===r.county){
      el.classList.add("selected");
      el.parentNode.appendChild(el);                  // keep the bold outline on top
    }
  });
  // per-county VALUE labels while a metric badge is active — the number
  // ($ or applicants) rendered under the county name, zoom-compensated
  const gv=$("map").querySelector("g.gv");
  if(gv){
    const sc=MAP.sc||1;
    gv.innerHTML = !S.mapMetric ? "" : rows.map(r=>{
      if(!r.fips||!rowPass(r)) return "";
      const v=metricValue(r); if(!v) return "";
      const c=MAP.center[r.fips]; if(!c) return "";
      const lab=document.getElementById("l"+r.fips);
      const named=lab&&lab.classList.contains("on");
      const fs=10.5/sc, halo=(2.4/sc).toFixed(2);
      const y=c[1]+(named?fs*1.6:fs*0.35);
      return `<text class="ctyval num" x="${c[0].toFixed(1)}" y="${y.toFixed(1)}" style="font-size:${fs.toFixed(2)}px;stroke-width:${halo}px">${S.mapMetric==="dollars"?fmt$c(v):v}</text>`;
    }).join("");
  }
  // totals under the map (COMPLETE): both figures, honoring the current
  // filters + category slice — in normal flow so nothing overlaps
  const mt=$("mapTotals");
  if(mt){
    if(COMPLETE){
      const pass=rows.filter(rowPass);
      const t$=pass.reduce((a,r)=>a+(catValue(r)||0),0);
      const tA=pass.reduce((a,r)=>a+(appsValue(r)||0),0);
      mt.hidden=false;
      // sliced: lead with "Cat D —" (or the type-group name) once, bold —
      // it governs BOTH figures
      const sl=sliceLab();
      const lead=sl==="A–B"?"Emergency A–B":sl==="C–G"?"Permanent C–G":sl?("Cat "+sl.split("").join(", ")):null;
      const catLead=lead
        ?`<span class="mt-cat" title="Category slice — applies to both figures"><b>${lead}</b> —</span>`:"";
      mt.innerHTML=`${catLead}<span>$ Validated <b class="num">${fmt$(t$)}</b></span>
        <span>Applicants <b class="num">${tA}</b></span>`;
    } else mt.hidden=true;
  }
}

/* tooltip */
function showTip(cty,x,y){
  const r=rowFor(cty,S.event); if(!r) return hideTip();
  const tip=$("tip");
  const sc=dispStageColor(r);
  tip.innerHTML=`
    <div class="t-name">${esc(cty)} County
      ${COMPLETE?"":`<span class="t-stage" style="background:${sc};color:${contrastText(sc)}">${dispStage(r)}</span>`}</div>
    <div class="t-row"><span>Validated</span><b class="num">${showsMoney(r)?fmt$(r.validated_total):(r.ingested?"pending review":(r.stage>0?"in SharePoint — not in drop":"—"))}</b></div>
    <div class="t-row"><span>County indicator</span><b class="num">${fmtPct(r.pct_of_target)} of ${fmt$c(r.county_threshold)}</b></div>
    <div class="t-row"><span>Applicants</span><b class="num">${r.applicants_n??"—"}</b></div>
    ${r.inspector?`<div class="t-row"><span>Inspector</span><b>${esc(r.inspector)}</b></div>`:""}
    <div class="t-muted">Click to open the Chart A review</div>`;
  tip.style.display="block";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(x+16,innerWidth-w-10)+"px";
  tip.style.top=Math.min(y+14,innerHeight-h-10)+"px";
}
function hideTip(){ $("tip").style.display="none"; }
function contrastText(hex){
  const c=hex.replace("#",""); if(c.length<6) return "#1b1b1b";
  const n=parseInt(c,16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.2126*r+0.7152*g+0.0722*b)>140 ? "#1b1b1b" : "#f6f8fb";
}

function isSourceFile(f){
  if(!f.source_events||!f.source_events.length) return false;
  return S.event==="ALL" ? true : f.source_events.includes(S.event);

/* ---- county file tree ----
   The county's SharePoint folder, as it really is: every subfolder and every
   document, each one a link. A node's URL is <prefix>/<disp>, so swapping the
   site base under Admin re-points the whole tree. `prefix_path` = straight out
   of the export (exact); `prefix_rel` = composed off the PDA root, which is
   what a completed drop with no export gets (labeled). */
function treePrefix(e){
  if(!e) return null;
  if(e.prefix_path!=null) return "/"+e.prefix_path;
  if(S.rootPath!=null && e.prefix_rel!=null)
    return S.rootPath+(e.prefix_rel?"/"+e.prefix_rel:"");
  return null;
}
function nestNodes(nodes){
  const root={dirs:new Map(), files:[], name:"", disp:""};
  nodes.forEach(n=>{
    const parts=String(n.disp||"").split("/").filter(Boolean);
    let cur=root;
    parts.forEach((p,i)=>{
      const sofar=parts.slice(0,i+1).join("/");
      if(i===parts.length-1 && !n.folder){
        cur.files.push(Object.assign({}, n, {label:p, full:sofar}));
      } else {
        if(!cur.dirs.has(p)) cur.dirs.set(p,{dirs:new Map(), files:[], name:p, disp:sofar});
        cur=cur.dirs.get(p);
      }
    });
  });
  return root;
}
const countTreeFiles = d => d.files.length +
  [...d.dirs.values()].reduce((a,x)=>a+countTreeFiles(x),0);
function fileTreeHTML(cty){
  const e=DATA.files[cty];
  if(!e||!e.nodes||!e.nodes.length)
    return `<div class="linknote">No files for this county in the drop.</div>`;
  const base=trimSlash(S.spBase), prefix=treePrefix(e);
  const url = d => (base&&prefix) ? base+"/"+encPath(prefix+"/"+d) : null;
  const render=(node,depth)=>{
    let out="";
    [...node.dirs.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{
      const u=url(d.disp), n=countTreeFiles(d);
      out+=`<details class="ftdir" open>
        <summary><span class="fic fic-dir">DIR</span><span class="ftname">${esc(d.name)}</span>
          <span class="ftn">${n} file${n===1?"":"s"}</span>
          ${u?`<a class="ftopen" href="${esc(u)}" target="_blank" rel="noopener" title="Open this folder in SharePoint">open ↗</a>`:""}
        </summary><div class="ftkids">${render(d,depth+1)}</div></details>`;
    });
    node.files.slice().sort((a,b)=>a.label.localeCompare(b.label))
      .forEach(f=>{ out+=fileRow(f, url(f.full), f.label); });
    return out;
  };
  return `<div class="ftree">${render(nestNodes(e.nodes),0)}</div>`
    + (e.prefix_path==null?`<div class="linknote">Folder layout read from the data drop (this drop has no SharePoint export) — links are composed from the PDA folder.</div>`:"");
}
// the county's own Chart A workbook in SharePoint: the export's exact path
// when there is one, else composed from the drop layout under the PDA root
function chartAUrl(r){
  const base=trimSlash(S.spBase);
  if(base && r.source_path) return base+"/"+encPath(r.source_path);
  const e=DATA.files[r.county];
  if(base && S.rootPath && r.source_rel && e && e.prefix_path==null)
    return base+"/"+encPath(S.rootPath+"/"+r.source_rel);

function fileRow(f, hrefOverride, labelOverride){
  // tree nodes carry `label` (leaf name), pipeline rows carry `name`
  const nm=labelOverride||f.name||f.label||"";
  const ext=(nm.split(".").pop()||"").toLowerCase();
  const [lab,cls]={xlsx:["XLS","x"],xls:["XLS","x"],pdf:["PDF","p"],docx:["DOC","d"],doc:["DOC","d"],
    msg:["MSG","m"],tif:["IMG","i"],jpg:["IMG","i"],jpeg:["IMG","i"],png:["IMG","i"],pptx:["PPT","t"]}[ext]||["FILE","o"];
  const ic=`<span class="fic fic-${cls}">${lab}</span>`;
  const src=isSourceFile(f);
  const inTree=labelOverride!==undefined;   // tree nodes have no pipeline stage
  const FSTAGE={4:"Entered",3:"Ready",2:"Lead Review"};
  let stageBadge="";
  if(inTree){ stageBadge=""; }
  else if(f.stage>=2){
    const c=stageColor(f.stage);
    stageBadge=`<span class="stagetag fstage" style="background:${c};color:${contrastText(c)}">${FSTAGE[f.stage]}</span>`;
  } else if(f.is_chart){
    stageBadge=`<span class="stagetag fstage" style="background:${css("--s0")};color:${contrastText(css("--s0"))}">Not submitted</span>`;
  }
  const badges=`${src?`<span class="srcbadge" title="This workbook is where the board's numbers for this county come from">SOURCE</span>`:""}${stageBadge}`;
  const meta=`${[f.by||"", fmtTs(f.modified)].filter(x=>x&&x!=="—").join(" · ")}`;
  const href=hrefOverride!==undefined?hrefOverride:fileUrl(f);
  return href
    ? `<a class="file ${src?"issrc":""}" href="${esc(href)}" target="_blank" rel="noopener">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></a>`
    : `<span class="file nolink ${src?"issrc":""}" title="${esc(f.disp||nm)}">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></span>`;
}

  $("tickNote").textContent=pts.length<2?" — one snapshot so far; each data refresh adds a point":"";

  const rowBar = r => {
    if(!COMPLETE) return "";
    const w=Math.round(100*rowMetric(r)/rowBarMax);
    if(mixed){
      const m=metOf(r);
      const strong=m?"rgba(63,143,104,.30)":"rgba(192,82,72,.32)";
      const weak  =m?"rgba(63,143,104,.10)":"rgba(192,82,72,.12)";
      return ` style="background:linear-gradient(90deg,${strong} ${w}%,${weak} ${w}%)"`;
    }
    const col = metOf(r) ? "var(--rowbar)" : "var(--rowbar-red)";
    return w>0?` style="background:linear-gradient(90deg,${col} ${w}%,transparent ${w}%)"`:"";
  };
  // COMPLETE: Applicants is a small count — hand its width to Validated $ so
  // eight-digit dollars + the category ▾ never clip
  const CW = COMPLETE ? (NOLINKS?["34%","24%","42%"]:["25%","19%","36%","20%"])
                      : ["31%","24%","23%","22%"];
  $("ctbl").innerHTML=`<colgroup>${["c-county","c-stage","c-val","c-pct"].slice(0,CW.length).map((cl,i)=>
    `<col class="${cl}" style="width:${CW[i]}">`).join("")}</colgroup><thead><tr>${TCOLS.map(c=>
    `<th class="${c.cls}" data-col="${c.k}">${c.k==="dollars"?dollarsLabel:c.label}${S.sort.col===c.k?` <span class="arr">${S.sort.dir>0?"▲":"▼"}</span>`:""}${FILTERS[c.k]?fmenu(c.k):""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>{
    const sel=S.selected&&S.selected.key===r.county;
    const dv = catNarrowed()?catValue(r):r.validated_total;
    if(COMPLETE){
      const fu=NOLINKS?null:countyFolderUrl(r.county);
      // the selected county's row grows a link bar: the canonical Chart A
      // (the master workbook from the Entered in Table A folder) + its folder
      const cu=(sel&&!NOLINKS)?chartAUrl(r):null;
      const linkrow=(sel&&!NOLINKS)?`<tr class="linkrow"><td colspan="4"><div class="lb">
        ${cu?`<a class="chartalink sm" href="${esc(cu)}" target="_blank" rel="noopener" title="The master Chart A workbook this county's figures come from (Entered in Table A)">Chart A workbook ↗</a>`:""}
        ${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener">County folder ↗</a>`:""}
      </div></td></tr>`:"";
      return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}"${rowBar(r)}>
        <td><b>${esc(r.county)}</b></td>
        <td class="r num">${appsValue(r)??"—"}</td>
        <td class="r num">${fmt$(dv)}</td>
        ${NOLINKS?"":`<td>${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener" title="Open the ${esc(r.county)} county folder">Open ↗</a>`
                 :`<span class="muted" title="No county folder base — set one under Admin (gear) &rarr; SharePoint links">—</span>`}</td>`}</tr>`+linkrow;
    }
    const sc=dispStageColor(r);
    const p=r.pct_of_target;
    const showP = r.stage>=3 && p!=null;
    return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}">
      <td><b>${esc(r.county)}</b></td>
      <td><span class="stagetag" style="background:${sc};color:${contrastText(sc)}">${r.stage>=3?SHORT_STAGE[r.stage]:(S.admin&&r.stage===2?"Review":"—")}</span></td>
      <td class="r num">${showsMoney(r)?`<span class="${r.stage>=3?"":"pendval"}">${fmt$(dv)}</span>`:"—"}</td>
      <td class="r num pctcell ${showP&&p>=100?"ok":""}">${showP?fmtPct(p):"—"}</td></tr>`;
  }).join("")}</tbody>`;
}
const FILTER_SETS = () => ({stage:S.stageSel, pct:S.pctSel, dollars:S.catSel});
const FILTER_ALL = {stage:["4","3","2","pre"],
                    pct:["met","half","under","review","none"],
                    dollars:ALLCATS};
$("ctbl").addEventListener("click",e=>{
  if(e.target.closest("a")) return;   // let folder/Chart A links navigate
  const cb=e.target.closest("input[data-fk]");
  if(cb){
    const set=FILTER_SETS()[cb.dataset.fk];
    // values may be comma lists (type mode: "A,B") — apply to every member
    cb.dataset.fv.split(",").forEach(v=>cb.checked?set.add(v):set.delete(v));
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  const fa=e.target.closest("[data-fall]");
  if(fa){
    const k=fa.dataset.fall, set=FILTER_SETS()[k];
    FILTER_ALL[k].forEach(v=>set.add(v));
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  if(e.target.closest(".fmenu")) return;               // clicks inside the menu stay put
  const fb=e.target.closest("[data-fm]");
  if(fb){ S.openMenu=S.openMenu===fb.dataset.fm?null:fb.dataset.fm; renderRight(); return; }
  const th=e.target.closest("th[data-col]");
  if(th){
    if(S.sort.col===th.dataset.col) S.sort.dir*=-1;
    else S.sort={col:th.dataset.col, dir:th.dataset.col==="county"?1:-1};
    S.openMenu=null; renderRight(); return;
  }
  const tr=e.target.closest("tr[data-cty]");
  if(tr){
    S.openMenu=null;
    // clicking the already-open county collapses it (same as ‹ Back / Esc)
    if(S.selected && S.selected.key===tr.dataset.cty) backToTable();
    else openCounty(tr.dataset.cty);
  }
});


/* ---------------- health ---------------- */
function renderHealth(){
  if(!$("hbadge")) return;                     // panel off (Admin menu)
  const items=DATA.health||[];
  const recon=DATA.reconciliation||[];
  const all=[...recon.map(r=>({code:"TABLE_A_GAP",detail:`${r.county}: Chart A ${fmt$(r.chart_a)} vs Table A ${fmt$(r.table_a)} (Δ ${fmt$(r.delta)})`})),...items];
  $("hbadge").textContent=all.length;
  $("hbadge").className="hbadge"+(all.length?"":" ok");
  $("hitems").innerHTML=all.length?all.map(i=>`<div><span class="code">${esc(i.code)}</span>${esc(i.detail)}</div>`).join(""):
    `<div class="muted">No flags. Every parsed dollar reconciles.</div>`;
}

/* ---------------- render all ---------------- */
function renderAll(){
  renderRail(); paintMap(); renderRight(); renderChartPane();
  renderTicker(); renderMovers(); renderHealth();
}
renderAll();
addEventListener("resize",()=>renderTicker());
</script>
