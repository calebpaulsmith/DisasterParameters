        <span class="htt" title="${esc(d.title||"")}">${esc(d.title||"")}${d.undesignated?` <span class="flagchip" title="PA dollars recorded in this county for a disaster whose declaration did not designate it">not designated</span>`:""}</span>
        <span class="hta num">${d.applicants||0} applicant${d.applicants===1?"":"s"}</span>
        <b class="num">${d.paObligated?fmt$c(d.paObligated):"—"}</b></div>`).join("")}
    </div>`:""}
    ${apps.length?`<div class="hah">Prior PA applicants · ${apps.length}</div>
    <div class="halist">${apps.map(a=>`
      <div class="ha"><span class="han">${esc(a.name)}</span>
        <span class="had">${(a.disasters||[]).map(x=>`${dmap[x.dn]?dnLab(dmap[x.dn]):"DR-"+x.dn} (${fmt$c(x.pa)})`).join(", ")}</span>
        <b class="num">${fmt$c(a.pa)}</b></div>`).join("")}
    </div>`:""}
    <div class="linknote">Static snapshot pulled directly from OpenFEMA — PublicAssistanceFundedProjectsSummaries v1 (applicant × county × disaster, federal share obligated) + DisasterDeclarationsSummaries v2${meta.covidExcluded?" · COVID-19 excluded":""}. Context only, not a projection. <b>Last updated ${fmtDate(meta.fetchedAt)}</b></div>`;
  return collapsed
    ? `<details class="card fold hist"><summary>Prior FEMA history</summary>${inner}</details>`
    : `<div class="card hist"><h3>Prior FEMA history</h3>${inner}</div>`;
}
function histChart(dis){
  const n=dis.length,slotW=76,L=8,Rp=8,top=16,base=86,H=116;
  const W=L+Rp+n*slotW,bw=15,hh=base-top-4;
  const maxA=Math.max(1,...dis.map(d=>d.applicants||0));
  const maxP=Math.max(1,...dis.map(d=>d.paObligated||0));
  return `<svg class="httl" style="max-width:${Math.round(W*1.5)}px" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prior disasters with PA activity: applicants and PA obligated per declaration">
    <line x1="${L}" y1="${base}" x2="${W-Rp}" y2="${base}" class="htax"/>
    ${dis.map((d,i)=>{const cx=L+slotW*(i+0.5);
      const hA=d.applicants?Math.max(4,Math.round(hh*d.applicants/maxA)):2;
      const hP=d.paObligated?Math.max(4,Math.round(hh*d.paObligated/maxP)):2;
      const yr=d.declared?d.declared.slice(0,4):"";
      return `<g><title>${esc(dnLab(d)+" — "+(d.title||"")+" · declared "+fmtDate(d.declared)+" · "+(d.applicants||0)+" PA applicants"+(d.paObligated?" · "+fmt$c(d.paObligated)+" PA obligated":""))}</title>
        <rect x="${(cx-bw-1).toFixed(1)}" y="${base-hA}" width="${bw}" height="${hA}" rx="2" class="htbar a"/>
        <rect x="${(cx+1).toFixed(1)}" y="${base-hP}" width="${bw}" height="${hP}" rx="2" class="htbar p"/>
        ${d.applicants&&d.paObligated&&Math.abs(hA-hP)<14
          ?`<text x="${cx.toFixed(1)}" y="${base-Math.max(hA,hP)-4}" text-anchor="middle"><tspan class="htn">${d.applicants}</tspan><tspan class="htn p"> · ${fmt$c(d.paObligated)}</tspan></text>`
          :`${d.applicants?`<text x="${(cx-1-bw/2).toFixed(1)}" y="${base-hA-4}" class="htn" text-anchor="middle">${d.applicants}</text>`:""}
        ${d.paObligated?`<text x="${(cx+1+bw/2).toFixed(1)}" y="${base-hP-4}" class="htn p" text-anchor="middle">${fmt$c(d.paObligated)}</text>`:""}`}
        <text x="${cx.toFixed(1)}" y="${base+14}" class="htdnl" text-anchor="middle">${dnLab(d)}</text>
        <text x="${cx.toFixed(1)}" y="${base+26}" class="htyr2" text-anchor="middle">${yr}</text></g>`;}).join("")}
  </svg>
  <div class="htkey"><span><i style="background:var(--blue-dark)"></i>PA applicants</span><span><i style="background:var(--m3)"></i>PA obligated (own scale)</span></div>`;
}
function isSourceFile(f){
  if(!f.source_events||!f.source_events.length) return false;
  return S.event==="ALL" ? true : f.source_events.includes(S.event);
}
/* ---- county file tree ----
   The county's SharePoint folder, as it really is: every subfolder and every
   document, each one a link. A node's URL is <prefix>/<disp>, so swapping the
   site base under Admin re-points the whole tree. `prefix_path` = straight out
   of the export (exact); `prefix_rel` = composed off the PDA root, which is
   what a completed drop with no export gets (labeled). */
function treePrefix(e){
  if(!e) return null;
  if(e.prefix_path!=null) return "/"+e.prefix_path;
  if(S.rootPath!=null && e.prefix_rel!=null)
    return S.rootPath+(e.prefix_rel?"/"+e.prefix_rel:"");
  return null;
}
function nestNodes(nodes){
  const root={dirs:new Map(), files:[], name:"", disp:""};
  nodes.forEach(n=>{
    const parts=String(n.disp||"").split("/").filter(Boolean);
    let cur=root;
    parts.forEach((p,i)=>{
      const sofar=parts.slice(0,i+1).join("/");
      if(i===parts.length-1 && !n.folder){
        cur.files.push(Object.assign({}, n, {label:p, full:sofar}));
      } else {
        if(!cur.dirs.has(p)) cur.dirs.set(p,{dirs:new Map(), files:[], name:p, disp:sofar});
        cur=cur.dirs.get(p);
      }
    });
  });
  return root;
}
const countTreeFiles = d => d.files.length +
  [...d.dirs.values()].reduce((a,x)=>a+countTreeFiles(x),0);
function fileTreeHTML(cty){
  const e=DATA.files[cty];
  if(!e||!e.nodes||!e.nodes.length)
    return `<div class="linknote">No files for this county in the drop.</div>`;
  const base=trimSlash(S.spBase), prefix=treePrefix(e);
  const url = d => (base&&prefix) ? base+"/"+encPath(prefix+"/"+d) : null;
  const render=(node,depth)=>{
    let out="";
    [...node.dirs.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(d=>{
      const u=url(d.disp), n=countTreeFiles(d);
      out+=`<details class="ftdir" open>
        <summary><span class="fic fic-dir">DIR</span><span class="ftname">${esc(d.name)}</span>
          <span class="ftn">${n} file${n===1?"":"s"}</span>
          ${u?`<a class="ftopen" href="${esc(u)}" target="_blank" rel="noopener" title="Open this folder in SharePoint">open ↗</a>`:""}
        </summary><div class="ftkids">${render(d,depth+1)}</div></details>`;
    });
    node.files.slice().sort((a,b)=>a.label.localeCompare(b.label))
      .forEach(f=>{ out+=fileRow(f, url(f.full), f.label); });
    return out;
  };
  return `<div class="ftree">${render(nestNodes(e.nodes),0)}</div>`
    + (e.prefix_path==null?`<div class="linknote">Folder layout read from the data drop (this drop has no SharePoint export) — links are composed from the PDA folder.</div>`:"");
}
// the county's own Chart A workbook in SharePoint: the export's exact path
// when there is one, else composed from the drop layout under the PDA root
function chartAUrl(r){
  const base=trimSlash(S.spBase);
  if(base && r.source_path) return base+"/"+encPath(r.source_path);
  const e=DATA.files[r.county];
  if(base && S.rootPath && r.source_rel && e && e.prefix_path==null)
    return base+"/"+encPath(S.rootPath+"/"+r.source_rel);
  return r.sp_url||null;
}
function fileRow(f, hrefOverride, labelOverride){
  // tree nodes carry `label` (leaf name), pipeline rows carry `name`
  const nm=labelOverride||f.name||f.label||"";
  const ext=(nm.split(".").pop()||"").toLowerCase();
  const [lab,cls]={xlsx:["XLS","x"],xls:["XLS","x"],pdf:["PDF","p"],docx:["DOC","d"],doc:["DOC","d"],
    msg:["MSG","m"],tif:["IMG","i"],jpg:["IMG","i"],jpeg:["IMG","i"],png:["IMG","i"],pptx:["PPT","t"]}[ext]||["FILE","o"];
  const ic=`<span class="fic fic-${cls}">${lab}</span>`;
  const src=isSourceFile(f);
  const inTree=labelOverride!==undefined;   // tree nodes have no pipeline stage
  const FSTAGE={4:"Entered",3:"Ready",2:"Lead Review"};
  let stageBadge="";
  if(inTree){ stageBadge=""; }
  else if(f.stage>=2){
    const c=stageColor(f.stage);
    stageBadge=`<span class="stagetag fstage" style="background:${c};color:${contrastText(c)}">${FSTAGE[f.stage]}</span>`;
  } else if(f.is_chart){
    stageBadge=`<span class="stagetag fstage" style="background:${css("--s0")};color:${contrastText(css("--s0"))}">Not submitted</span>`;
  }
  const badges=`${src?`<span class="srcbadge" title="This workbook is where the board's numbers for this county come from">SOURCE</span>`:""}${stageBadge}`;
  const meta=`${[f.by||"", fmtTs(f.modified)].filter(x=>x&&x!=="—").join(" · ")}`;
  const href=hrefOverride!==undefined?hrefOverride:fileUrl(f);
  return href
    ? `<a class="file ${src?"issrc":""}" href="${esc(href)}" target="_blank" rel="noopener">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></a>`
    : `<span class="file nolink ${src?"issrc":""}" title="${esc(f.disp||nm)}">${ic}<span class="nm">${esc(nm)}${badges}</span><span class="meta">${meta}</span></span>`;
}

/* ---------------- ticker + movers ---------------- */
function renderTicker(){
  const svg=$("ticker");
  if(!svg || !svg.clientWidth) return;         // panel off or folded shut
  const W=svg.clientWidth,H=190,padL=64,padR=16,padT=14,padB=26;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const ev=S.event, snaps=DATA.snapshots;
  const pts=snaps.map(s=>({ts:s.run_ts,v:(s.events[ev]||{}).validated_total??null})).filter(p=>p.v!=null);
  const thresh=DATA.indicators.state_threshold;
  $("tickNote").textContent=pts.length<2?" — one snapshot so far; each data refresh adds a point":"";
  if(!pts.length){svg.innerHTML="";return;}
  const ymax=Math.max(thresh||0,...pts.map(p=>p.v))*1.06||1;
  const x=i=>pts.length===1?(padL+(W-padL-padR)/2):padL+(W-padL-padR)*i/(pts.length-1);
  const y=v=>padT+(H-padT-padB)*(1-v/ymax);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=pts.length>1?`${line}L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z`:"";
  const gridVals=[0,.25,.5,.75,1].map(f=>f*ymax);
  svg.innerHTML=`
    ${gridVals.map(v=>`<line x1="${padL}" x2="${W-padR}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}" stroke-width="1"></line>
      <text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="${css("--ink3")}">${fmt$c(v)}</text>`).join("")}
    ${thresh?`<line x1="${padL}" x2="${W-padR}" y1="${y(thresh)}" y2="${y(thresh)}" stroke="${css("--accent")}" stroke-width="1.5" stroke-dasharray="6 4"></line>
      <text x="${W-padR}" y="${y(thresh)-6}" text-anchor="end" font-size="10.5" font-weight="700" fill="${css("--accent-ink")}">state indicator ${fmt$c(thresh)}</text>`:""}
    ${area?`<path d="${area}" fill="${css("--m3")}" opacity="0.13"></path>`:""}
    ${pts.length>1?`<path d="${line}" fill="none" stroke="${css("--m3")}" stroke-width="2"></path>`:""}
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3}"
        fill="${i===pts.length-1?css("--accent"):css("--m3")}" stroke="${css("--surface2")}" stroke-width="2">
        <title>${fmtTs(p.ts)} — ${fmt$(p.v)}</title></circle>`).join("")}
    <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-11}" text-anchor="${pts.length===1?"middle":"end"}"
        font-size="12" font-weight="800" fill="${css("--ink")}">${fmt$(pts[pts.length-1].v)}</text>
    <text x="${padL}" y="${H-8}" font-size="10" fill="${css("--ink3")}">${fmtTs(pts[0].ts)}</text>
    ${pts.length>1?`<text x="${W-padR}" y="${H-8}" text-anchor="end" font-size="10" fill="${css("--ink3")}">${fmtTs(pts[pts.length-1].ts)}</text>`:""}`;
}
function renderMovers(){
  const wrap=$("movers");
  if(!wrap) return;                            // panel off (Admin menu)
  const ms=DATA.movers.filter(m=>S.event==="ALL"||m.event_id===S.event);
  if(!ms.length){wrap.innerHTML=`<div class="none">${DATA.snapshots.length<2?"First snapshot — movers appear from the second refresh on.":"No changes since the previous refresh."}</div>`;return;}
  wrap.innerHTML=ms.slice(0,20).map(m=>{
    if(m.kind==="stage") return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="st">→ ${STAGE_LABELS[m.to_stage]}</span></div>`;
    if(m.kind==="new") return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="st">new</span>${m.delta_total?`<span class="up num">+${fmt$c(m.delta_total)}</span>`:""}</div>`;
    const up=m.delta_total>=0;
    return `<div class="m"><span class="cty-n">${esc(m.county)}</span><span class="${up?"up":"dn"} num">${up?"+":"−"}${fmt$c(Math.abs(m.delta_total))}</span></div>`;
  }).join("");
}

/* ---------------- right panel: scope band + county table ---------------- */
const SHORT_STAGE={2:"Review",3:"Ready",4:"Entered"};
const TCOLS=COMPLETE?[
  // COMPLETE: stage is meaningless (all entered) -> applicant count; % of PCI
  // lives on the map/clock -> the column becomes the county-folder link
  {k:"county", label:"County",       cls:"",  get:r=>r.county},
  {k:"apps",   label:"Applicants",   cls:"r", get:r=>appsValue(r)},
  {k:"dollars",label:"Validated $",  cls:"r", get:r=>catValue(r)??-1},
  {k:"folder", label:"Folder",       cls:"",  get:r=>r.county},
]:[
  {k:"county", label:"County",         cls:"",  get:r=>r.county},
  {k:"stage",  label:"Stage",          cls:"",  get:r=>r.stage},
  {k:"dollars",label:"Validated $",    cls:"r", get:r=>catValue(r)??r.validated_total??-1},
  {k:"pct",    label:"% of PCI", cls:"r", get:r=>r.pct_of_target??-1},
];
function countyFolderUrl(cty){
  const base=(S.masterFolder||"").trim().replace(/\/+$/,"");
  return base ? base+"/"+encodeURIComponent(cty) : null;
}
function renderRight(){
  const s=summary(), st=s.counties_by_stage||{}, scope=s.counties_total||0;
  const segs=[[4,st[4]||0],[3,st[3]||0],[2,st[2]||0]];
  const rest=scope-segs.reduce((a,x)=>a+x[1],0);
  $("scopeband").innerHTML=COMPLETE?`
    <span class="sb-title">Counties · ${scope}</span>
    <span class="sb-extra num">applicant rows <b>${s.applicants_n}</b></span>`:`
    <span class="sb-title">Counties · ${scope}</span>
    <span class="sb-extra num">ready or entered <b>${s.counties_ready}/${scope}</b></span>
    <div class="sb-bar">${segs.filter(x=>x[1]).map(([k,n])=>
        `<i style="flex:${n};background:${stageColor(k)}" title="${STAGE_LABELS[k]}: ${n}"></i>`).join("")}
      ${rest?`<i style="flex:${rest};background:var(--s0)" title="Not yet submitted: ${rest}"></i>`:""}</div>
    <span class="sb-extra num">applicant rows <b>${s.applicants_n}</b></span>`;

  const col=TCOLS.find(c=>c.k===S.sort.col)||TCOLS[1];
  const rows=allRows(S.event).filter(rowPass).sort((a,b)=>{
    const va=col.get(a),vb=col.get(b);
    return (va<vb?-1:va>vb?1:(a.county<b.county?-1:1))*S.sort.dir;
  });
  const FILTERS=COMPLETE?{
    dollars:{sel:S.catSel, opts:ALLCATS.map(c=>[c,`${c} — ${CAT_NAMES[c]}`])},
  }:{
    stage:{sel:S.stageSel, opts:[["4",STAGE_LABELS[4]],["3",STAGE_LABELS[3]],["2",STAGE_LABELS[2]],["pre","Not yet submitted"]]},
    pct:  {sel:S.pctSel,   opts:[["met","≥ 100% — met"],["half","50 – 99%"],["under","under 50%"],["review","For PDA Lead Review"],["none","not submitted / no figure"]]},
    dollars:{sel:S.catSel, opts:ALLCATS.map(c=>[c,`${c} — ${CAT_NAMES[c]}`])},
  };
  const fmenu=k=>{
    const f=FILTERS[k];
    const filtered=f.sel.size<f.opts.length;
    const lab=k==="dollars"?"A–G ▾":"▾";   // the category slice deserves a real affordance
    return `<button class="fbtn ${filtered?"on":""}" data-fm="${k}" title="${k==="dollars"?"Filter by category of work":"Filter"}">${lab}</button>`+
      (S.openMenu===k?`<div class="fmenu">${f.opts.map(([v,l])=>
        `<label><input type="checkbox" data-fk="${k}" data-fv="${v}"${f.sel.has(v)?" checked":""}> ${l}</label>`).join("")}
        <button class="fall" data-fall="${k}">select all</button></div>`:"");
  };
  const dollarsLabel = catNarrowed()
    ? `Validated $ · ${ALLCATS.filter(c=>S.catSel.has(c)).join("")}`
    : "Validated $";
  // COMPLETE: Applicants is a small count — hand its width to Validated $ so
  // eight-digit dollars + the category ▾ never clip
  const CW = COMPLETE ? ["25%","19%","36%","20%"] : ["31%","24%","23%","22%"];
  $("ctbl").innerHTML=`<colgroup>${["c-county","c-stage","c-val","c-pct"].map((cl,i)=>
    `<col class="${cl}" style="width:${CW[i]}">`).join("")}</colgroup><thead><tr>${TCOLS.map(c=>
    `<th class="${c.cls}" data-col="${c.k}">${c.k==="dollars"?dollarsLabel:c.label}${S.sort.col===c.k?` <span class="arr">${S.sort.dir>0?"▲":"▼"}</span>`:""}${FILTERS[c.k]?fmenu(c.k):""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map(r=>{
    const sel=S.selected&&S.selected.key===r.county;
    const dv = catNarrowed()?catValue(r):r.validated_total;
    if(COMPLETE){
      const fu=countyFolderUrl(r.county);
      // the selected county's row grows a link bar: the canonical Chart A
      // (the master workbook from the Entered in Table A folder) + its folder
      const cu=sel?chartAUrl(r):null;
      const linkrow=sel?`<tr class="linkrow"><td colspan="4"><div class="lb">
        ${cu?`<a class="chartalink sm" href="${esc(cu)}" target="_blank" rel="noopener" title="The master Chart A workbook this county's figures come from (Entered in Table A)">Chart A workbook ↗</a>`:""}
        ${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener">County folder ↗</a>`:""}
      </div></td></tr>`:"";
      return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}">
        <td><b>${esc(r.county)}</b></td>
        <td class="r num">${appsValue(r)??"—"}</td>
        <td class="r num">${fmt$(dv)}</td>
        <td>${fu?`<a class="folderlink" href="${esc(fu)}" target="_blank" rel="noopener" title="Open the ${esc(r.county)} county folder">Open ↗</a>`
                 :`<span class="muted" title="No county folder base — set one under Admin (gear) &rarr; SharePoint links">—</span>`}</td></tr>`+linkrow;
    }
    const sc=dispStageColor(r);
    const p=r.pct_of_target;
    const showP = r.stage>=3 && p!=null;
    return `<tr class="crow ${sel?"selected":""}" data-cty="${esc(r.county)}">
      <td><b>${esc(r.county)}</b></td>
      <td><span class="stagetag" style="background:${sc};color:${contrastText(sc)}">${r.stage>=3?SHORT_STAGE[r.stage]:(S.admin&&r.stage===2?"Review":"—")}</span></td>
      <td class="r num">${showsMoney(r)?`<span class="${r.stage>=3?"":"pendval"}">${fmt$(dv)}</span>`:"—"}</td>
      <td class="r num pctcell ${showP&&p>=100?"ok":""}">${showP?fmtPct(p):"—"}</td></tr>`;
  }).join("")}</tbody>`;
}
const FILTER_SETS = () => ({stage:S.stageSel, pct:S.pctSel, dollars:S.catSel});
const FILTER_ALL = {stage:["4","3","2","pre"],
                    pct:["met","half","under","review","none"],
                    dollars:ALLCATS};
$("ctbl").addEventListener("click",e=>{
  if(e.target.closest("a")) return;   // let folder/Chart A links navigate
  const cb=e.target.closest("input[data-fk]");
  if(cb){
    const set=FILTER_SETS()[cb.dataset.fk];
    cb.checked?set.add(cb.dataset.fv):set.delete(cb.dataset.fv);
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  const fa=e.target.closest("[data-fall]");
  if(fa){
    const k=fa.dataset.fall, set=FILTER_SETS()[k];
    FILTER_ALL[k].forEach(v=>set.add(v));
    paintMap(); renderRight(); renderRail(); renderChartPane(); return;
  }
  if(e.target.closest(".fmenu")) return;               // clicks inside the menu stay put
  const fb=e.target.closest("[data-fm]");
  if(fb){ S.openMenu=S.openMenu===fb.dataset.fm?null:fb.dataset.fm; renderRight(); return; }
  const th=e.target.closest("th[data-col]");
  if(th){
    if(S.sort.col===th.dataset.col) S.sort.dir*=-1;
    else S.sort={col:th.dataset.col, dir:th.dataset.col==="county"?1:-1};
    S.openMenu=null; renderRight(); return;
  }
  const tr=e.target.closest("tr[data-cty]");
  if(tr){
    S.openMenu=null;
    // clicking the already-open county collapses it (same as ‹ Back / Esc)
    if(S.selected && S.selected.key===tr.dataset.cty) backToTable();
    else openCounty(tr.dataset.cty);
  }
});


/* ---------------- health ---------------- */
function renderHealth(){
  if(!$("hbadge")) return;                     // panel off (Admin menu)
  const items=DATA.health||[];
  const recon=DATA.reconciliation||[];
  const all=[...recon.map(r=>({code:"TABLE_A_GAP",detail:`${r.county}: Chart A ${fmt$(r.chart_a)} vs Table A ${fmt$(r.table_a)} (Δ ${fmt$(r.delta)})`})),...items];
  $("hbadge").textContent=all.length;
  $("hbadge").className="hbadge"+(all.length?"":" ok");
  $("hitems").innerHTML=all.length?all.map(i=>`<div><span class="code">${esc(i.code)}</span>${esc(i.detail)}</div>`).join(""):
    `<div class="muted">No flags. Every parsed dollar reconciles.</div>`;
}

/* ---------------- render all ---------------- */
function renderAll(){
  renderRail(); paintMap(); renderRight(); renderChartPane();
  renderTicker(); renderMovers(); renderHealth();
}
renderAll();
addEventListener("resize",()=>renderTicker());
